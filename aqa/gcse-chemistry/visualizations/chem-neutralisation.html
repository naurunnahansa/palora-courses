<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neutralisation Reaction Simulator</title>
    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a2747; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  h1, h2, h3 { font-family: system-ui, -apple-system, sans-serif; }
  .container { max-width: 100%; width: 100%; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); border: 1px solid #d4d8e5; padding: 24px; margin-bottom: 18px; }
  h1 { color: #1835b4; font-size: 1.5rem; text-align: center; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 16px; }
  canvas { width: 100%; background: #fafbfc; border-radius: 10px; display: block; }
  .btn { background: #1835b4; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; transition: background 0.2s; }
  .btn:hover { background: #4f6a8a; }
  .chip { display: inline-block; padding: 6px 12px; border-radius: 20px; border: 1.5px solid #d4d8e5; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; margin: 3px; background: #fff; user-select: none; }
  .chip:hover, .chip.active { background: #1835b4; color: #fff; border-color: #1835b4; }
  .info-box { background: #e8ecf8; border-radius: 10px; padding: 14px; margin-top: 14px; font-size: 0.85rem; line-height: 1.5; }
  .info-box strong { color: #1835b4; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row label { font-size: 0.85rem; font-weight: 500; min-width: 100px; }
  input[type=range] { flex: 1; accent-color: #1835b4; }
  .ph-display { text-align: center; font-size: 2rem; font-family: system-ui, -apple-system, sans-serif; padding: 10px; border-radius: 10px; margin-top: 10px; transition: all 0.3s; }
  .equation { text-align: center; font-size: 1rem; font-family: system-ui, -apple-system, sans-serif; padding: 10px; background: #fafbfc; border-radius: 8px; margin-top: 10px; }
  .neutralised { animation: pulse 0.6s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  .select-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .select-row select { flex: 1; padding: 8px; border-radius: 8px; border: 1.5px solid #d4d8e5; font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Neutralisation Simulator</h1>
    <p class="subtitle">Add acid to alkali and watch the pH change</p>
    <div class="select-row">
      <select id="acidSelect">
        <option value="HCl">Hydrochloric acid (HCl)</option>
        <option value="H2SO4">Sulfuric acid (H2SO4)</option>
        <option value="HNO3">Nitric acid (HNO3)</option>
      </select>
      <select id="alkaliSelect">
        <option value="NaOH">Sodium hydroxide (NaOH)</option>
        <option value="KOH">Potassium hydroxide (KOH)</option>
      </select>
    </div>
    <canvas id="simCanvas" width="502" height="260"></canvas>
    <div class="controls">
      <div class="slider-row">
        <label>Add acid:</label>
        <input type="range" id="acidSlider" min="0" max="100" value="0">
        <span id="acidVal" style="font-size:0.85rem; min-width:35px;">0%</span>
      </div>
      <button class="btn" id="resetBtn" style="align-self:center;">Reset</button>
    </div>
  </div>
  <div class="card">
    <div class="ph-display" id="phDisplay">pH 14</div>
    <div class="equation" id="equation"></div>
    <div class="info-box" id="infoBox">
      Move the slider to add acid to the alkali solution and observe the neutralisation reaction.
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('acidSlider');
const acidVal = document.getElementById('acidVal');
const phDisplay = document.getElementById('phDisplay');
const infoBox = document.getElementById('infoBox');
const eqDiv = document.getElementById('equation');
const acidSelect = document.getElementById('acidSelect');
const alkaliSelect = document.getElementById('alkaliSelect');

const salts = {
  'HCl+NaOH': 'sodium chloride (NaCl)',
  'HCl+KOH': 'potassium chloride (KCl)',
  'H2SO4+NaOH': 'sodium sulfate (Na2SO4)',
  'H2SO4+KOH': 'potassium sulfate (K2SO4)',
  'HNO3+NaOH': 'sodium nitrate (NaNO3)',
  'HNO3+KOH': 'potassium nitrate (KNO3)',
};

function phColor(ph) {
  const colors = ['#ff0000','#ff4400','#ff8800','#ffbb00','#ffee00','#ccff00','#66ff00','#00cc00','#009966','#006699','#0033cc','#2200cc','#4400aa','#660088','#880066'];
  return colors[Math.min(14, Math.max(0, Math.round(ph)))];
}

function indicatorColor(ph) {
  if (ph < 4) return '#e74c3c';
  if (ph < 6) return '#e67e22';
  if (ph < 8) return '#27ae60';
  if (ph < 10) return '#2980b9';
  return '#8e44ad';
}

function getPh(pct) {
  // Starts at pH 14 (alkali), goes to pH 1 (excess acid). pH 7 at 50%
  if (pct <= 50) return 14 - (pct / 50) * 7;
  return 7 - ((pct - 50) / 50) * 6;
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const pct = parseInt(slider.value);
  const ph = getPh(pct);

  // Acid beaker (left)
  const bx1 = 60, by = 80, bw = 140, bh = 150;
  ctx.strokeStyle = '#1835b4';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx1, by); ctx.lineTo(bx1, by + bh); ctx.lineTo(bx1 + bw, by + bh); ctx.lineTo(bx1 + bw, by);
  ctx.stroke();
  // Acid liquid
  const acidLevel = (100 - pct) / 100;
  ctx.fillStyle = 'rgba(231,76,60,0.35)';
  ctx.fillRect(bx1 + 1, by + bh - bh * acidLevel, bw - 2, bh * acidLevel - 1);
  ctx.font = '500 12px Outfit';
  ctx.fillStyle = '#e74c3c';
  ctx.textAlign = 'center';
  ctx.fillText(acidSelect.value, bx1 + bw/2, by - 8);
  ctx.fillText('ACID', bx1 + bw/2, by - 24);

  // Alkali beaker (right)
  const bx2 = 300;
  ctx.strokeStyle = '#1835b4';
  ctx.beginPath();
  ctx.moveTo(bx2, by); ctx.lineTo(bx2, by + bh); ctx.lineTo(bx2 + bw, by + bh); ctx.lineTo(bx2 + bw, by);
  ctx.stroke();
  // Mixed liquid
  const mixColor = indicatorColor(ph);
  ctx.fillStyle = mixColor + '55';
  ctx.fillRect(bx2 + 1, by + 10, bw - 2, bh - 11);
  ctx.font = '500 12px Outfit';
  ctx.fillStyle = '#8e44ad';
  ctx.textAlign = 'center';
  ctx.fillText(alkaliSelect.value, bx2 + bw/2, by - 8);
  ctx.fillText('ALKALI + INDICATOR', bx2 + bw/2, by - 24);

  // Arrow
  ctx.fillStyle = '#1835b4';
  ctx.beginPath();
  ctx.moveTo(220, 140);
  ctx.lineTo(260, 130);
  ctx.lineTo(260, 150);
  ctx.closePath();
  ctx.fill();
  ctx.font = '500 10px Outfit';
  ctx.fillStyle = '#1835b4';
  ctx.textAlign = 'center';
  ctx.fillText('adding acid', 240, 120);

  // pH indicator circle
  ctx.beginPath();
  ctx.arc(bx2 + bw/2, by + bh/2, 28, 0, Math.PI * 2);
  ctx.fillStyle = indicatorColor(ph);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.font = '700 16px Oswald';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(ph.toFixed(1), bx2 + bw/2, by + bh/2 + 6);
}

function update() {
  const pct = parseInt(slider.value);
  const ph = getPh(pct);
  acidVal.textContent = pct + '%';
  phDisplay.textContent = 'pH ' + ph.toFixed(1);
  phDisplay.style.background = phColor(ph) + '22';
  phDisplay.style.color = phColor(ph);

  const acid = acidSelect.value;
  const alkali = alkaliSelect.value;
  const salt = salts[acid + '+' + alkali];

  eqDiv.innerHTML = '<strong>Ionic equation:</strong> H<sup>+</sup>(aq) + OH<sup>-</sup>(aq) → H<sub>2</sub>O(l)';

  if (Math.abs(ph - 7) < 0.5) {
    phDisplay.classList.add('neutralised');
    infoBox.innerHTML = `<strong style="color:#27ae60;">Neutralised!</strong><br>The acid and alkali have reacted to form <strong>${salt}</strong> and water.<br>acid + alkali → salt + water`;
  } else if (ph > 7) {
    phDisplay.classList.remove('neutralised');
    infoBox.innerHTML = `Solution is <strong>alkaline</strong> (pH ${ph.toFixed(1)}). Keep adding acid to neutralise.`;
  } else {
    phDisplay.classList.remove('neutralised');
    infoBox.innerHTML = `Solution is now <strong>acidic</strong> (pH ${ph.toFixed(1)}). Too much acid has been added!`;
  }
  draw();
}

slider.addEventListener('input', update);
acidSelect.addEventListener('change', update);
alkaliSelect.addEventListener('change', update);
document.getElementById('resetBtn').addEventListener('click', () => { slider.value = 0; update(); });
update();
</script>
</body>
</html>
