<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electromagnetic Induction</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family: system-ui, -apple-system, sans-serif;background: #fcfcfe;padding:10px 12px;color:#1a2747}.container{max-width: 100%;margin:0 auto}h1{font-family: system-ui, -apple-system, sans-serif;font-size:1.0rem;color:#1835b4;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.subtitle{text-align:center;font-size:.78rem;color:#4a5568;margin-bottom:10px}.card{border-radius:5px;border:1px solid #d4d8e5;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px;margin-bottom:10px;background:#fff}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc;cursor:grab}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.readout{background:#e8ecf8;border-radius:5px;padding:8px;text-align:center}.readout .label{font-size:.72rem;color:#4a5568}.readout .value{font-family: system-ui, -apple-system, sans-serif;font-size:1.1rem;color:#1835b4}.info{background:#fafbfc;border-radius:5px;padding:8px;font-size:.75rem;color:#4a5568;text-align:center;margin-top:8px}.info strong{color:#1835b4}</style>
</head>
<body>
<div class="container">
    <h1>Electromagnetic Induction</h1>
    <p class="subtitle">Drag the magnet in and out of the coil</p>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="500"></canvas></div>
    <div class="readouts">
        <div class="readout"><div class="label">Induced Voltage</div><div class="value" id="emfVal">0.0 V</div></div>
        <div class="readout"><div class="label">Magnet Speed</div><div class="value" id="speedVal">0 m/s</div></div>
    </div>
    <div class="info"><strong>Faraday's Law:</strong> Moving a magnet through a coil induces a voltage. Faster movement = greater voltage. Reversing direction reverses the voltage (<strong>Lenz's Law</strong>).</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let magnetX=200,magnetY=250,dragging=false,lastMagX=200,emf=0,lastTs=0;

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*500/1060)+'px'}
function getPos(e){const r=canvas.getBoundingClientRect();const sx=canvas.width/r.width;return{x:((e.touches?e.touches[0].clientX:e.clientX)-r.left)*sx}}

canvas.addEventListener('mousedown',e=>{dragging=true});
canvas.addEventListener('mousemove',e=>{if(!dragging)return;magnetX=getPos(e).x;magnetX=Math.max(80,Math.min(canvas.width-80,magnetX))});
canvas.addEventListener('mouseup',()=>dragging=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();dragging=true});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!dragging)return;magnetX=getPos(e).x;magnetX=Math.max(80,Math.min(canvas.width-80,magnetX))});
canvas.addEventListener('touchend',e=>{e.preventDefault();dragging=false});

function draw(ts){
    const dt=lastTs?(ts-lastTs)/1000:0;lastTs=ts;
    const speed=(magnetX-lastMagX)/(dt||1)/1000;
    lastMagX+=(magnetX-lastMagX)*0.3;

    const W=canvas.width,H=canvas.height;
    const coilX=W*0.55,coilY=H/2;
    const distToCoil=Math.abs(magnetX-coilX);
    const inCoil=distToCoil<80;

    // EMF based on rate of change of flux (speed near coil)
    const rawEmf=inCoil?speed*0.05:0;
    emf+=(rawEmf-emf)*0.2;

    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);

    // Coil (solenoid shape)
    for(let i=0;i<8;i++){
        const x=coilX-40+i*10;
        ctx.beginPath();ctx.ellipse(x,coilY,8,60,0,0,Math.PI*2);
        ctx.strokeStyle='#c87533';ctx.lineWidth=2;ctx.stroke();
    }

    // Galvanometer
    const gx=coilX,gy=coilY+140;
    ctx.beginPath();ctx.arc(gx,gy,30,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#1835b4';ctx.lineWidth=2;ctx.stroke();
    // Needle
    const needleAngle=-Math.PI/2+Math.min(0.8,Math.max(-0.8,emf*2));
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+25*Math.cos(needleAngle),gy+25*Math.sin(needleAngle));
    ctx.strokeStyle='#dc3545';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#1835b4';ctx.font='500 10px Outfit';ctx.textAlign='center';ctx.fillText('G',gx,gy+45);
    // Scale marks
    ctx.beginPath();ctx.moveTo(gx-20,gy);ctx.lineTo(gx+20,gy);ctx.strokeStyle='#d4d8e5';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(gx,gy-25);ctx.lineTo(gx,gy);ctx.stroke();

    // Wires from coil to galvanometer
    ctx.beginPath();ctx.moveTo(coilX-40,coilY+60);ctx.lineTo(coilX-40,gy);ctx.lineTo(gx-30,gy);ctx.strokeStyle='#c87533';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(coilX+30,coilY+60);ctx.lineTo(coilX+30,gy);ctx.lineTo(gx+30,gy);ctx.stroke();

    // Magnet
    const my=coilY;
    ctx.fillStyle='#dc3545';ctx.fillRect(magnetX-60,my-20,60,40);
    ctx.fillStyle='#4a90d9';ctx.fillRect(magnetX,my-20,60,40);
    ctx.fillStyle='#fff';ctx.font='700 16px Oswald';ctx.textAlign='center';
    ctx.fillText('N',magnetX-30,my+6);ctx.fillText('S',magnetX+30,my+6);

    // Field lines from magnet
    if(true){
        ctx.setLineDash([3,3]);ctx.strokeStyle='#63738140';ctx.lineWidth=1;
        for(let i=-1;i<=1;i++){
            ctx.beginPath();ctx.moveTo(magnetX-60,my+i*12);ctx.lineTo(magnetX-100,my+i*25);ctx.stroke();
            ctx.beginPath();ctx.moveTo(magnetX+60,my+i*12);ctx.lineTo(magnetX+100,my+i*25);ctx.stroke();
        }
        ctx.setLineDash([]);
    }

    // Labels
    ctx.fillStyle='#4a5568';ctx.font='500 13px Outfit';ctx.textAlign='center';
    ctx.fillText('← Drag magnet →',magnetX,my-35);

    document.getElementById('emfVal').textContent=(emf*10).toFixed(1)+' V';
    document.getElementById('speedVal').textContent=Math.abs(speed*10).toFixed(1)+' m/s';

    requestAnimationFrame(draw);
}
resize();window.addEventListener('resize',resize);requestAnimationFrame(draw);
</script>
</body>
</html>
