<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalars vs Vectors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', system-ui, sans-serif; background: #FFFFFF; padding: 10px 12px; color: #1a1f2e; }
        .container { max-width: 550px; margin: 0 auto; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 1.0rem; color: #637EA1; text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .subtitle { text-align: center; font-size: 0.78rem; color: #4a5568; margin-bottom: 12px; }
        .score-bar { display: flex; justify-content: space-between; align-items: center; background: #F5E6E8; border-radius: 5px; padding: 6px 12px; margin-bottom: 10px; font-size: 0.8rem; font-weight: 600; }
        .score-bar span { color: #637EA1; }
        .drop-zones { display: flex; gap: 8px; margin-bottom: 10px; }
        .drop-zone { flex: 1; min-height: 120px; border: 2px dashed #e5dfe0; border-radius: 5px; padding: 8px; text-align: center; transition: all 0.2s; }
        .drop-zone.over { border-color: #637EA1; background: rgba(99,126,161,0.06); }
        .drop-zone h2 { font-family: 'Oswald', sans-serif; font-size: 0.82rem; color: #637EA1; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        .drop-zone .desc { font-size: 0.68rem; color: #4a5568; margin-bottom: 6px; }
        .items-area { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
        .item { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #e5dfe0; border-radius: 5px; padding: 5px 10px; font-size: 0.78rem; font-weight: 500; cursor: grab; user-select: none; transition: all 0.2s; }
        .item:active { cursor: grabbing; transform: scale(1.05); }
        .item.correct { background: #d4edda; border-color: #28a745; }
        .item.incorrect { background: #f8d7da; border-color: #dc3545; animation: shake 0.4s; }
        .item.placed { opacity: 0.5; pointer-events: none; }
        .dropped-item { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #e5dfe0; border-radius: 5px; padding: 4px 8px; font-size: 0.72rem; font-weight: 500; margin: 2px; }
        .dropped-item.correct { background: #d4edda; border-color: #28a745; }
        .dropped-item.incorrect { background: #f8d7da; border-color: #dc3545; }
        .vector-demo { border: 1px solid #e5dfe0; border-radius: 5px; padding: 10px; margin-top: 8px; }
        .vector-demo h2 { font-family: 'Oswald', sans-serif; font-size: 0.82rem; color: #637EA1; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; text-align: center; }
        .vector-demo p { font-size: 0.72rem; color: #4a5568; text-align: center; margin-bottom: 6px; }
        canvas { display: block; margin: 0 auto; border: 1px solid #e5dfe0; border-radius: 4px; cursor: crosshair; }
        .vector-info { text-align: center; font-size: 0.72rem; color: #4a5568; margin-top: 6px; }
        .vector-info strong { color: #637EA1; }
        .reset-btn { display: block; margin: 10px auto 0; background: #637EA1; color: #fff; border: none; border-radius: 5px; padding: 6px 18px; font-family: 'Outfit', sans-serif; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .reset-btn:hover { background: #506a8a; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    </style>
</head>
<body>
<div class="container">
    <h1>Scalars vs Vectors</h1>
    <p class="subtitle">Drag each quantity into the correct category</p>
    <div class="score-bar">
        <span id="scoreText">Score: 0 / 0</span>
        <span id="streakText">Streak: 0</span>
    </div>
    <div class="drop-zones">
        <div class="drop-zone" id="scalarZone">
            <h2>Scalar</h2>
            <div class="desc">Magnitude only</div>
            <div id="scalarItems"></div>
        </div>
        <div class="drop-zone" id="vectorZone">
            <h2>Vector</h2>
            <div class="desc">Magnitude + Direction</div>
            <div id="vectorItems"></div>
        </div>
    </div>
    <div class="items-area" id="itemsArea"></div>
    <div class="vector-demo">
        <h2>Vector Direction Explorer</h2>
        <p>Click and drag on the canvas to draw a vector arrow</p>
        <canvas id="vectorCanvas" width="520" height="160"></canvas>
        <div class="vector-info" id="vectorInfo">Draw an arrow to see its magnitude and direction</div>
    </div>
    <button class="reset-btn" onclick="resetGame()">Reset</button>
</div>
<script>
const quantities = [
    { name: 'Speed', type: 'scalar', icon: '⏱' },
    { name: 'Velocity', type: 'vector', icon: '➡' },
    { name: 'Mass', type: 'scalar', icon: '⚖' },
    { name: 'Force', type: 'vector', icon: '💪' },
    { name: 'Temperature', type: 'scalar', icon: '🌡' },
    { name: 'Acceleration', type: 'vector', icon: '🚀' },
    { name: 'Distance', type: 'scalar', icon: '📏' },
    { name: 'Displacement', type: 'vector', icon: '📐' },
    { name: 'Energy', type: 'scalar', icon: '⚡' },
    { name: 'Momentum', type: 'vector', icon: '🎱' },
    { name: 'Time', type: 'scalar', icon: '⏰' },
    { name: 'Weight', type: 'vector', icon: '⬇' }
];

let score = 0, attempts = 0, streak = 0;
let draggedItem = null;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function createItems() {
    const area = document.getElementById('itemsArea');
    area.innerHTML = '';
    shuffle([...quantities]).forEach(q => {
        const el = document.createElement('div');
        el.className = 'item';
        el.draggable = true;
        el.dataset.name = q.name;
        el.dataset.type = q.type;
        el.innerHTML = `${q.icon} ${q.name}`;
        el.addEventListener('dragstart', e => {
            draggedItem = el;
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => el.style.opacity = '0.4', 0);
        });
        el.addEventListener('dragend', () => { el.style.opacity = '1'; });
        area.appendChild(el);
    });
}

function setupDropZones() {
    ['scalarZone', 'vectorZone'].forEach(id => {
        const zone = document.getElementById(id);
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('over'));
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('over');
            if (!draggedItem) return;
            const name = draggedItem.dataset.name;
            const type = draggedItem.dataset.type;
            const expectedType = id === 'scalarZone' ? 'scalar' : 'vector';
            const correct = type === expectedType;
            attempts++;
            if (correct) { score++; streak++; } else { streak = 0; }
            document.getElementById('scoreText').textContent = `Score: ${score} / ${attempts}`;
            document.getElementById('streakText').textContent = `Streak: ${streak}`;
            const container = document.getElementById(id === 'scalarZone' ? 'scalarItems' : 'vectorItems');
            const droppedEl = document.createElement('div');
            droppedEl.className = `dropped-item ${correct ? 'correct' : 'incorrect'}`;
            const q = quantities.find(q => q.name === name);
            droppedEl.innerHTML = `${q.icon} ${name} ${correct ? '✓' : '✗'}`;
            container.appendChild(droppedEl);
            draggedItem.classList.add('placed');
            draggedItem = null;
        });
    });
}

// Vector canvas
const canvas = document.getElementById('vectorCanvas');
const ctx = canvas.getContext('2d');
let drawing = false, startX, startY, endX, endY;

function resizeCanvas() {
    const w = Math.min(520, document.querySelector('.container').clientWidth - 24);
    canvas.width = w;
    canvas.height = 160;
    drawVector();
}

function drawVector() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fafafa';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // grid
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < canvas.width; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
    for (let y = 0; y < canvas.height; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
    if (startX !== undefined && endX !== undefined) {
        const dx = endX - startX, dy = endY - startY;
        const mag = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(-dy, dx) * 180 / Math.PI;
        // shaft
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = '#637EA1';
        ctx.lineWidth = 3;
        ctx.stroke();
        // arrowhead
        if (mag > 5) {
            const headLen = Math.min(16, mag * 0.3);
            const a = Math.atan2(dy, dx);
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headLen * Math.cos(a - 0.4), endY - headLen * Math.sin(a - 0.4));
            ctx.lineTo(endX - headLen * Math.cos(a + 0.4), endY - headLen * Math.sin(a + 0.4));
            ctx.closePath();
            ctx.fillStyle = '#637EA1';
            ctx.fill();
        }
        // dot at start
        ctx.beginPath();
        ctx.arc(startX, startY, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#F4D35E';
        ctx.fill();
        ctx.strokeStyle = '#637EA1';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        document.getElementById('vectorInfo').innerHTML =
            `Magnitude: <strong>${mag.toFixed(1)} px</strong> | Direction: <strong>${angle.toFixed(1)}°</strong> from horizontal`;
    }
}

canvas.addEventListener('mousedown', e => {
    const r = canvas.getBoundingClientRect();
    startX = e.clientX - r.left; startY = e.clientY - r.top;
    endX = startX; endY = startY;
    drawing = true;
});
canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    const r = canvas.getBoundingClientRect();
    endX = e.clientX - r.left; endY = e.clientY - r.top;
    drawVector();
});
canvas.addEventListener('mouseup', () => drawing = false);
canvas.addEventListener('mouseleave', () => drawing = false);
// touch
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    startX = t.clientX - r.left; startY = t.clientY - r.top;
    endX = startX; endY = startY;
    drawing = true;
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!drawing) return;
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    endX = t.clientX - r.left; endY = t.clientY - r.top;
    drawVector();
});
canvas.addEventListener('touchend', e => { e.preventDefault(); drawing = false; });

function resetGame() {
    score = 0; attempts = 0; streak = 0;
    document.getElementById('scoreText').textContent = 'Score: 0 / 0';
    document.getElementById('streakText').textContent = 'Streak: 0';
    document.getElementById('scalarItems').innerHTML = '';
    document.getElementById('vectorItems').innerHTML = '';
    startX = startY = endX = endY = undefined;
    document.getElementById('vectorInfo').textContent = 'Draw an arrow to see its magnitude and direction';
    createItems();
    drawVector();
}

createItems();
setupDropZones();
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
