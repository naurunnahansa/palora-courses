<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uses of Radioactivity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',system-ui,sans-serif;background:#FFF;padding:10px 12px;color:#1a1f2e}.container{max-width:550px;margin:0 auto}h1{font-family:'Oswald',sans-serif;font-size:1.0rem;color:#637EA1;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.use-card{border-radius:5px;border:1px solid #e5dfe0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;background:#fff;cursor:pointer;transition:all .2s}.use-card:hover{border-color:#637EA1;transform:translateY(-1px)}.use-card.active{border-color:#637EA1;background:#F5E6E8}.use-card .name{font-family:'Oswald',sans-serif;font-size:.8rem;color:#637EA1;text-transform:uppercase}.use-card .type{font-size:.65rem;color:#4a5568;margin-top:2px}.card{border-radius:5px;border:1px solid #e5dfe0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px;margin-top:10px;background:#fff}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc}.info{background:#fafbfc;border-radius:5px;padding:10px;margin-top:8px;font-size:.75rem;color:#4a5568}.info strong{color:#637EA1}</style>
</head>
<body>
<div class="container">
    <h1>Uses of Radioactivity</h1>
    <div class="grid" id="grid"></div>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="380"></canvas></div>
    <div class="info" id="info"></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let sel=0,lastTs=0,animT=0;

const uses=[
    {name:'Medical Tracers',type:'Gamma emitters',desc:'A <strong>gamma-emitting</strong> tracer is injected or swallowed. A gamma camera detects the radiation to create an image of organs, showing blockages or abnormalities. Gamma is used because it can pass through the body.',icon:'medical'},
    {name:'Cancer Treatment',type:'Gamma radiation',desc:'<strong>Gamma rays</strong> are focused on tumours to destroy cancer cells. The beam is rotated around the patient so healthy tissue receives a lower dose. This is called <strong>radiotherapy</strong>.',icon:'treatment'},
    {name:'Smoke Detectors',type:'Alpha emitters',desc:'An <strong>alpha source</strong> ionises air between two plates, allowing a small current to flow. Smoke particles absorb the alpha radiation, reducing the current and triggering the alarm. Alpha is used because it is easily absorbed.',icon:'smoke'},
    {name:'Thickness Control',type:'Beta emitters',desc:'A <strong>beta source</strong> is placed on one side of paper/metal and a detector on the other. If the material gets too thick, less beta radiation passes through, and the rollers adjust. Beta is used because it is partially absorbed by thin materials.',icon:'thickness'},
    {name:'Sterilisation',type:'Gamma radiation',desc:'<strong>Gamma rays</strong> kill bacteria on medical equipment and food without heating them. Gamma is used because it has high penetrating power and can reach all surfaces.',icon:'sterilise'},
    {name:'Carbon Dating',type:'Beta emitters (C-14)',desc:'Living organisms absorb <strong>carbon-14</strong> (a beta emitter). After death, C-14 decays with a half-life of 5,730 years. Measuring the remaining C-14 tells us the age of archaeological samples.',icon:'dating'}
];

const grid=document.getElementById('grid');
uses.forEach((u,i)=>{
    const d=document.createElement('div');d.className='use-card'+(i===0?' active':'');
    d.innerHTML=`<div class="name">${u.name}</div><div class="type">${u.type}</div>`;
    d.onclick=()=>{sel=i;document.querySelectorAll('.use-card').forEach((c,j)=>c.classList.toggle('active',j===i));document.getElementById('info').innerHTML=u.desc};
    grid.appendChild(d);
});
document.getElementById('info').innerHTML=uses[0].desc;

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*380/1060)+'px'}

function draw(ts){
    const dt=lastTs?(ts-lastTs)/1000:0;lastTs=ts;animT+=dt;
    const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#637EA1';ctx.font='600 14px Oswald';ctx.textAlign='center';
    ctx.fillText(uses[sel].name.toUpperCase(),cx,25);

    if(sel===0){
        // Medical tracer - body outline with gamma camera
        ctx.strokeStyle='#4a5568';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(cx,cy-40,30,40,0,0,Math.PI*2);ctx.stroke(); // head
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+80);ctx.stroke(); // body
        ctx.beginPath();ctx.moveTo(cx-50,cy+30);ctx.lineTo(cx+50,cy+30);ctx.stroke(); // arms
        // Tracer dots
        for(let i=0;i<5;i++){
            const tx=cx+Math.sin(animT+i*1.3)*20;const ty=cy+20+Math.cos(animT+i)*25;
            ctx.beginPath();ctx.arc(tx,ty,4,0,Math.PI*2);ctx.fillStyle=`rgba(244,211,94,${0.5+Math.sin(animT*3+i)*0.3})`;ctx.fill();
        }
        // Gamma camera
        ctx.fillStyle='#637EA1';ctx.fillRect(cx+120,cy-50,80,100);
        ctx.fillStyle='#fff';ctx.font='500 10px Outfit';ctx.fillText('Gamma',cx+160,cy-5);ctx.fillText('Camera',cx+160,cy+10);
        // Rays
        for(let i=0;i<3;i++){
            const ry=cy-15+i*15;
            ctx.beginPath();ctx.moveTo(cx+20,ry);ctx.lineTo(cx+120,ry);
            ctx.strokeStyle=`rgba(244,211,94,${0.3+Math.sin(animT*4+i)*0.2})`;ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
        }
    } else if(sel===1){
        // Cancer treatment - rotating beam
        ctx.beginPath();ctx.arc(cx,cy,50,0,Math.PI*2);ctx.fillStyle='#F5E6E8';ctx.fill();ctx.strokeStyle='#4a5568';ctx.lineWidth=2;ctx.stroke();
        ctx.fillStyle='#dc3545';ctx.beginPath();ctx.arc(cx+10,cy-5,12,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#4a5568';ctx.font='500 10px Outfit';ctx.textAlign='center';ctx.fillText('Tumour',cx+10,cy+20);
        // Rotating gamma beams
        for(let i=0;i<3;i++){
            const a=animT*0.5+i*Math.PI*2/3;
            const sx=cx+Math.cos(a)*150,sy=cy+Math.sin(a)*150;
            ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(cx+10,cy-5);
            ctx.strokeStyle=`rgba(244,211,94,0.4)`;ctx.lineWidth=8;ctx.stroke();
            ctx.strokeStyle='#F4D35E';ctx.lineWidth=2;ctx.stroke();
            ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fillStyle='#637EA1';ctx.fill();
            ctx.fillStyle='#fff';ctx.font='700 10px Oswald';ctx.fillText('γ',sx,sy+4);
        }
    } else if(sel===2){
        // Smoke detector
        ctx.fillStyle='#637EA1';ctx.fillRect(cx-100,cy-60,200,40);
        ctx.fillStyle='#fff';ctx.font='600 12px Oswald';ctx.textAlign='center';ctx.fillText('SMOKE DETECTOR',cx,cy-35);
        // Alpha source
        ctx.fillStyle='#F4D35E';ctx.beginPath();ctx.arc(cx-40,cy+10,10,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1a1f2e';ctx.font='700 12px Oswald';ctx.fillText('α',cx-40,cy+14);
        // Ion pairs
        for(let i=0;i<6;i++){
            const ix=cx-20+i*15;const iy=cy+10+Math.sin(animT*2+i)*5;
            ctx.fillStyle='#dc3545';ctx.beginPath();ctx.arc(ix,iy-5,3,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#4a90d9';ctx.beginPath();ctx.arc(ix,iy+5,3,0,Math.PI*2);ctx.fill();
        }
        // Detector
        ctx.fillStyle='#4a5568';ctx.fillRect(cx+60,cy,15,20);
        ctx.fillStyle='#4a5568';ctx.font='500 10px Outfit';ctx.fillText('Detector',cx+67,cy+35);
        ctx.fillText('Current flows → alarm OFF',cx,cy+70);
    } else if(sel===3){
        // Thickness control
        ctx.fillStyle='#a0a0a0';ctx.fillRect(cx-150,cy-5,300,10);
        ctx.fillStyle='#4a5568';ctx.font='500 11px Outfit';ctx.textAlign='center';ctx.fillText('Paper / metal sheet',cx,cy+25);
        // Beta source below
        ctx.fillStyle='#F4D35E';ctx.beginPath();ctx.arc(cx,cy+60,12,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1a1f2e';ctx.font='700 12px Oswald';ctx.fillText('β',cx,cy+64);
        ctx.fillStyle='#4a5568';ctx.font='500 10px Outfit';ctx.fillText('Beta source',cx,cy+85);
        // Detector above
        ctx.fillStyle='#637EA1';ctx.fillRect(cx-15,cy-50,30,25);
        ctx.fillStyle='#4a5568';ctx.font='500 10px Outfit';ctx.fillText('Detector',cx,cy-55);
        // Rays
        for(let i=0;i<3;i++){
            const rx=cx-10+i*10;
            ctx.beginPath();ctx.moveTo(rx,cy+48);ctx.lineTo(rx,cy-25);
            ctx.strokeStyle=`rgba(244,211,94,${0.3+Math.sin(animT*3+i)*0.2})`;ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
        }
        // Rollers
        ctx.beginPath();ctx.arc(cx-160,cy,15,0,Math.PI*2);ctx.strokeStyle='#4a5568';ctx.lineWidth=2;ctx.stroke();
        ctx.beginPath();ctx.arc(cx+160,cy,15,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#4a5568';ctx.font='500 10px Outfit';ctx.fillText('Rollers',cx-160,cy+30);
    } else if(sel===4){
        // Sterilisation
        ctx.fillStyle='#637EA1';ctx.fillRect(cx-80,cy-40,160,80);ctx.strokeStyle='#4a5568';ctx.lineWidth=2;ctx.strokeRect(cx-80,cy-40,160,80);
        ctx.fillStyle='#fff';ctx.font='600 12px Oswald';ctx.textAlign='center';ctx.fillText('MEDICAL',cx,cy-5);ctx.fillText('EQUIPMENT',cx,cy+12);
        // Gamma rays from source
        const sx=cx-200;
        ctx.fillStyle='#F4D35E';ctx.beginPath();ctx.arc(sx,cy,15,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1a1f2e';ctx.font='700 14px Oswald';ctx.fillText('γ',sx,cy+5);
        for(let i=0;i<5;i++){
            const rx=sx+30+i*30+((animT*50)%30);
            ctx.beginPath();ctx.moveTo(rx,cy-20);ctx.lineTo(rx,cy+20);
            ctx.strokeStyle=`rgba(244,211,94,${0.5-i*0.08})`;ctx.lineWidth=2;ctx.stroke();
        }
        // Bacteria being killed
        ctx.fillStyle='#dc3545';ctx.font='500 10px Outfit';ctx.fillText('Bacteria killed',cx,cy+60);
    } else {
        // Carbon dating
        ctx.fillStyle='#c87533';ctx.fillRect(cx-60,cy-30,120,60);ctx.strokeStyle='#8B4513';ctx.lineWidth=2;ctx.strokeRect(cx-60,cy-30,120,60);
        ctx.fillStyle='#fff';ctx.font='600 12px Oswald';ctx.textAlign='center';ctx.fillText('FOSSIL',cx,cy+5);
        // C-14 atoms decaying
        for(let i=0;i<8;i++){
            const remaining=8-Math.floor(animT%8);
            const fx=cx-40+i*12;const fy=cy-15;
            ctx.beginPath();ctx.arc(fx,fy,4,0,Math.PI*2);
            ctx.fillStyle=i<remaining?'#4a90d9':'#e5dfe0';ctx.fill();
        }
        ctx.fillStyle='#4a5568';ctx.font='500 11px Outfit';
        ctx.fillText('C-14 atoms remaining',cx,cy-35);
        // Half-life arrow
        ctx.fillStyle='#637EA1';ctx.font='600 13px Oswald';
        ctx.fillText('Half-life = 5,730 years',cx,cy+55);
        // Timeline
        ctx.strokeStyle='#637EA1';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-180,cy+80);ctx.lineTo(cx+180,cy+80);ctx.stroke();
        for(let i=0;i<=4;i++){
            const tx=cx-180+i*90;
            ctx.beginPath();ctx.moveTo(tx,cy+75);ctx.lineTo(tx,cy+85);ctx.stroke();
            ctx.fillStyle='#4a5568';ctx.font='500 9px Outfit';ctx.fillText((i*5730)+'y',tx,cy+98);
        }
    }

    requestAnimationFrame(draw);
}
resize();window.addEventListener('resize',resize);requestAnimationFrame(draw);
</script>
</body>
</html>
