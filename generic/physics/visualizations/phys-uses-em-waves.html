<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uses of EM Waves</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #fcfcfe; padding: 10px 12px; color: #1a2747; }
        .container { max-width: 100%; margin: 0 auto; }
        h1 { font-family: system-ui, -apple-system, sans-serif; font-size: 1.0rem; color: #1835b4; text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .spectrum-bar { display: flex; height: 30px; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
        .spec-seg { flex: 1; cursor: pointer; transition: all 0.2s; position: relative; }
        .spec-seg:hover { transform: scaleY(1.3); }
        .spec-seg.active { transform: scaleY(1.5); box-shadow: 0 0 8px rgba(0,0,0,0.3); z-index: 1; }
        .spec-label { font-size: 0.55rem; color: #fff; text-align: center; line-height: 30px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .detail-card { border: 1px solid #d4d8e5; border-radius: 5px; padding: 12px; background: #fff; min-height: 160px; }
        .detail-card .name { font-family: system-ui, -apple-system, sans-serif; font-size: 1.0rem; text-transform: uppercase; margin-bottom: 4px; }
        .detail-card .props { font-size: 0.75rem; color: #4a5568; margin-bottom: 6px; }
        .detail-card .section { margin-bottom: 6px; }
        .detail-card .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 0.78rem; color: #1835b4; text-transform: uppercase; margin-bottom: 3px; }
        .detail-card .items { display: flex; flex-wrap: wrap; gap: 4px; }
        .detail-card .item { background: #e8ecf8; border-radius: 4px; padding: 3px 8px; font-size: 0.72rem; }
        .detail-card .danger { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="container">
    <h1>Uses of EM Waves</h1>
    <div class="spectrum-bar" id="spectrumBar"></div>
    <div class="detail-card" id="detail">
        <div class="name" style="color:#1835b4;">Click a wave type above</div>
        <div class="props">The electromagnetic spectrum ranges from radio waves (longest wavelength) to gamma rays (shortest wavelength). All EM waves travel at the speed of light (3 × 10⁸ m/s).</div>
    </div>
</div>
<script>
const waves = [
    { name: 'Radio Waves', color: '#8b4513', wavelength: '> 0.1 m', frequency: '< 3 GHz',
      uses: ['TV broadcasting', 'Radio communication', 'Bluetooth/WiFi', 'MRI scanning'],
      dangers: ['Generally safe at low power'], source: 'Transmitters, oscillating circuits' },
    { name: 'Microwaves', color: '#c0392b', wavelength: '1 mm – 0.1 m', frequency: '3 – 300 GHz',
      uses: ['Microwave ovens', 'Mobile phones', 'Satellite communication', 'Radar'],
      dangers: ['Internal heating of body tissue'], source: 'Magnetrons, electronic circuits' },
    { name: 'Infrared', color: '#e74c3c', wavelength: '700 nm – 1 mm', frequency: '300 GHz – 430 THz',
      uses: ['TV remotes', 'Thermal imaging', 'Heating', 'Optical fibres'],
      dangers: ['Skin burns', 'Can cause thermal damage'], source: 'Warm/hot objects' },
    { name: 'Visible Light', color: 'linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff)', wavelength: '400 – 700 nm', frequency: '430 – 750 THz',
      uses: ['Seeing!', 'Photography', 'Optical fibres', 'Illumination'],
      dangers: ['Very bright light can damage eyes'], source: 'Stars, lamps, LEDs' },
    { name: 'Ultraviolet', color: '#8e44ad', wavelength: '10 – 400 nm', frequency: '750 THz – 30 PHz',
      uses: ['Sterilisation', 'Fluorescent lighting', 'Security marking', 'Sunbeds'],
      dangers: ['Skin cancer', 'Sunburn', 'Eye damage'], source: 'The Sun, UV lamps' },
    { name: 'X-rays', color: '#2980b9', wavelength: '0.01 – 10 nm', frequency: '30 PHz – 30 EHz',
      uses: ['Medical imaging', 'Airport security', 'CT scans', 'Detecting fractures'],
      dangers: ['Cell damage', 'Cancer risk', 'Mutations'], source: 'X-ray tubes, synchrotrons' },
    { name: 'Gamma Rays', color: '#1a5276', wavelength: '< 0.01 nm', frequency: '> 30 EHz',
      uses: ['Cancer treatment', 'Sterilising medical equipment', 'Food irradiation', 'PET scans'],
      dangers: ['Cell death', 'Cancer', 'Radiation sickness'], source: 'Radioactive decay, nuclear reactions' }
];

const bar = document.getElementById('spectrumBar');
waves.forEach((w, i) => {
    const seg = document.createElement('div');
    seg.className = 'spec-seg';
    seg.style.background = w.color;
    seg.innerHTML = `<div class="spec-label">${w.name.split(' ')[0]}</div>`;
    seg.onclick = () => {
        document.querySelectorAll('.spec-seg').forEach(s => s.classList.remove('active'));
        seg.classList.add('active');
        const usesHtml = w.uses.map(u => `<span class="item">${u}</span>`).join('');
        const dangersHtml = w.dangers.map(d => `<span class="item danger">${d}</span>`).join('');
        document.getElementById('detail').innerHTML = `
            <div class="name" style="color:${w.color.startsWith('linear') ? '#1835b4' : w.color};">${w.name}</div>
            <div class="props">Wavelength: ${w.wavelength} | Frequency: ${w.frequency}<br>Source: ${w.source}</div>
            <div class="section"><div class="section-title">Uses</div><div class="items">${usesHtml}</div></div>
            <div class="section"><div class="section-title">Dangers</div><div class="items">${dangersHtml}</div></div>`;
    };
    bar.appendChild(seg);
});
</script>
</body>
</html>
