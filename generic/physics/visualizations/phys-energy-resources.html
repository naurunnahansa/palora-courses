<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Resources</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #fcfcfe; padding: 10px 12px; color: #1a2747; }
        .container { max-width: 100%; margin: 0 auto; }
        h1 { font-family: system-ui, -apple-system, sans-serif; font-size: 1.0rem; color: #1835b4; text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .subtitle { text-align: center; font-size: 0.78rem; color: #4a5568; margin-bottom: 10px; }
        .score-bar { display: flex; justify-content: space-between; background: #e8ecf8; border-radius: 5px; padding: 6px 12px; margin-bottom: 10px; font-size: 0.8rem; font-weight: 600; }
        .score-bar span { color: #1835b4; }
        .drop-zones { display: flex; gap: 8px; margin-bottom: 10px; }
        .drop-zone { flex: 1; min-height: 100px; border: 2px dashed #d4d8e5; border-radius: 5px; padding: 8px; text-align: center; transition: all 0.2s; }
        .drop-zone.over { border-color: #1835b4; background: rgba(99,126,161,0.06); }
        .drop-zone h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 0.82rem; color: #1835b4; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .drop-zone .desc { font-size: 0.65rem; color: #4a5568; margin-bottom: 6px; }
        .items-area { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
        .item { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #d4d8e5; border-radius: 5px; padding: 5px 10px; font-size: 0.78rem; font-weight: 500; cursor: grab; user-select: none; transition: all 0.2s; }
        .item:active { cursor: grabbing; transform: scale(1.05); }
        .item.correct { background: #d4edda; border-color: #28a745; }
        .item.incorrect { background: #f8d7da; border-color: #dc3545; }
        .item.placed { opacity: 0.5; pointer-events: none; }
        .dropped-item { display: inline-flex; align-items: center; gap: 3px; background: #fff; border: 1px solid #d4d8e5; border-radius: 4px; padding: 3px 7px; font-size: 0.7rem; margin: 2px; }
        .dropped-item.correct { background: #d4edda; border-color: #28a745; }
        .dropped-item.incorrect { background: #f8d7da; border-color: #dc3545; }
        .detail { border: 1px solid #d4d8e5; border-radius: 5px; padding: 10px; background: #fafbfc; margin-top: 8px; }
        .detail .name { font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; color: #1835b4; text-transform: uppercase; }
        .detail .info { font-size: 0.75rem; color: #4a5568; margin-top: 4px; line-height: 1.5; }
        .reset-btn { display: block; margin: 10px auto 0; background: #1835b4; color: #fff; border: none; border-radius: 5px; padding: 6px 18px; font-family: system-ui, -apple-system, sans-serif; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .reset-btn:hover { background: #506a8a; }
    </style>
</head>
<body>
<div class="container">
    <h1>Energy Resources</h1>
    <p class="subtitle">Sort each energy source into renewable or non-renewable</p>
    <div class="score-bar"><span id="scoreText">Score: 0 / 0</span><span id="streakText">Streak: 0</span></div>
    <div class="drop-zones">
        <div class="drop-zone" id="renewZone"><h2>Renewable</h2><div class="desc">Will not run out</div><div id="renewItems"></div></div>
        <div class="drop-zone" id="nonrenewZone"><h2>Non-Renewable</h2><div class="desc">Will eventually run out</div><div id="nonrenewItems"></div></div>
    </div>
    <div class="items-area" id="itemsArea"></div>
    <div class="detail" id="detail"><div class="name">Click a sorted resource for details</div></div>
    <button class="reset-btn" onclick="reset()">Reset</button>
</div>
<script>
const resources = [
    { name: 'Solar', icon: '☀', type: 'renewable', info: 'Energy from sunlight using photovoltaic cells or solar thermal systems. Unlimited supply but depends on weather and daylight.' },
    { name: 'Wind', icon: '💨', type: 'renewable', info: 'Wind turbines convert kinetic energy of wind to electricity. No fuel costs but intermittent and requires windy locations.' },
    { name: 'Hydroelectric', icon: '🌊', type: 'renewable', info: 'Water flowing through dams drives turbines. Reliable and can respond quickly to demand. Requires suitable geography.' },
    { name: 'Geothermal', icon: '🌋', type: 'renewable', info: 'Heat from deep underground (radioactive decay) used to generate steam. Very reliable but limited to certain locations.' },
    { name: 'Tidal', icon: '🌙', type: 'renewable', info: 'Energy from the rise and fall of tides. Very predictable but expensive to build and limited suitable sites.' },
    { name: 'Biomass', icon: '🌿', type: 'renewable', info: 'Burning organic material (wood, crops, waste). Carbon neutral if replanted. Can produce pollution when burned.' },
    { name: 'Coal', icon: '⛏', type: 'nonrenewable', info: 'Fossil fuel formed over millions of years. Reliable and energy-dense but produces CO₂ and air pollutants.' },
    { name: 'Oil', icon: '🛢', type: 'nonrenewable', info: 'Fossil fuel used for transport and heating. Very energy-dense but produces greenhouse gases and will run out.' },
    { name: 'Natural Gas', icon: '🔥', type: 'nonrenewable', info: 'Fossil fuel that burns cleaner than coal/oil but still produces CO₂. Often used for heating and electricity.' },
    { name: 'Nuclear', icon: '☢', type: 'nonrenewable', info: 'Fission of uranium produces huge energy with no CO₂. However, produces radioactive waste and uranium is finite.' }
];

let score = 0, attempts = 0, streak = 0, draggedItem = null;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function createItems() {
    const area = document.getElementById('itemsArea');
    area.innerHTML = '';
    shuffle([...resources]).forEach(r => {
        const el = document.createElement('div');
        el.className = 'item'; el.draggable = true;
        el.dataset.name = r.name; el.dataset.type = r.type;
        el.innerHTML = `${r.icon} ${r.name}`;
        el.addEventListener('dragstart', e => { draggedItem = el; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => el.style.opacity = '0.4', 0); });
        el.addEventListener('dragend', () => el.style.opacity = '1');
        area.appendChild(el);
    });
}

function setupZones() {
    ['renewZone', 'nonrenewZone'].forEach(id => {
        const zone = document.getElementById(id);
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('over'));
        zone.addEventListener('drop', e => {
            e.preventDefault(); zone.classList.remove('over');
            if (!draggedItem) return;
            const name = draggedItem.dataset.name;
            const type = draggedItem.dataset.type;
            const expected = id === 'renewZone' ? 'renewable' : 'nonrenewable';
            const correct = type === expected;
            attempts++; if (correct) { score++; streak++; } else { streak = 0; }
            document.getElementById('scoreText').textContent = `Score: ${score} / ${attempts}`;
            document.getElementById('streakText').textContent = `Streak: ${streak}`;
            const container = document.getElementById(id === 'renewZone' ? 'renewItems' : 'nonrenewItems');
            const r = resources.find(r => r.name === name);
            const el = document.createElement('div');
            el.className = `dropped-item ${correct ? 'correct' : 'incorrect'}`;
            el.innerHTML = `${r.icon} ${name} ${correct ? '✓' : '✗'}`;
            el.onclick = () => {
                document.getElementById('detail').innerHTML = `<div class="name">${r.icon} ${r.name} (${r.type})</div><div class="info">${r.info}</div>`;
            };
            container.appendChild(el);
            draggedItem.classList.add('placed');
            draggedItem = null;
        });
    });
}

function reset() {
    score = 0; attempts = 0; streak = 0;
    document.getElementById('scoreText').textContent = 'Score: 0 / 0';
    document.getElementById('streakText').textContent = 'Streak: 0';
    document.getElementById('renewItems').innerHTML = '';
    document.getElementById('nonrenewItems').innerHTML = '';
    document.getElementById('detail').innerHTML = '<div class="name">Click a sorted resource for details</div>';
    createItems();
}

createItems(); setupZones();
</script>
</body>
</html>
