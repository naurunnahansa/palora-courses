<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Motor</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family: system-ui, -apple-system, sans-serif;background: #fcfcfe;padding:10px 12px;color:#1a2747}.container{max-width: 100%;margin:0 auto}h1{font-family: system-ui, -apple-system, sans-serif;font-size:1.0rem;color:#1835b4;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.subtitle{text-align:center;font-size:.78rem;color:#4a5568;margin-bottom:10px}.card{border-radius:5px;border:1px solid #d4d8e5;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px;margin-bottom:10px;background:#fff}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc}.slider-row{margin:8px 0}.slider-label{display:flex;justify-content:space-between;font-size:.8rem;color:#4a5568;margin-bottom:2px}.slider-label .val{font-weight:600;color:#1835b4}input[type="range"]{width:100%;accent-color:#1835b4}.info{background:#e8ecf8;border-radius:5px;padding:10px;font-size:.75rem;color:#4a5568}.info strong{color:#1835b4}</style>
</head>
<body>
<div class="container">
    <h1>DC Motor</h1>
    <p class="subtitle">A current-carrying coil rotates in a magnetic field</p>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="600"></canvas></div>
    <div class="slider-row"><div class="slider-label"><span>Current</span><span class="val" id="iLabel">5 A</span></div><input type="range" id="iSlider" min="0" max="10" value="5"></div>
    <div class="info">The motor effect: a <strong>current-carrying conductor</strong> in a <strong>magnetic field</strong> experiences a <strong>force</strong>. The <strong>commutator</strong> reverses the current direction every half turn to keep the coil spinning.</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let angle=0,lastTs=0;

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*600/1060)+'px'}

function draw(ts){
    const dt=lastTs?(ts-lastTs)/1000:0;lastTs=ts;
    const I=parseInt(document.getElementById('iSlider').value);
    angle+=dt*I*0.5;
    document.getElementById('iLabel').textContent=I+' A';

    const W=canvas.width,H=canvas.height,cx=W/2,cy=H*0.4;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);

    // Magnets
    ctx.fillStyle='#dc3545';ctx.fillRect(cx-220,cy-100,40,200);
    ctx.fillStyle='#fff';ctx.font='700 20px Oswald';ctx.textAlign='center';ctx.fillText('N',cx-200,cy+5);
    ctx.fillStyle='#4a90d9';ctx.fillRect(cx+180,cy-100,40,200);
    ctx.fillStyle='#fff';ctx.fillText('S',cx+200,cy+5);

    // Field lines
    ctx.setLineDash([4,4]);ctx.strokeStyle='#d4d8e5';ctx.lineWidth=1;
    for(let i=-2;i<=2;i++){
        ctx.beginPath();ctx.moveTo(cx-180,cy+i*35);ctx.lineTo(cx+180,cy+i*35);ctx.stroke();
    }
    ctx.setLineDash([]);

    // Rotating coil
    const coilW=120*Math.cos(angle);
    const coilH=80;
    ctx.save();ctx.translate(cx,cy);
    // Coil rectangle (perspective)
    ctx.strokeStyle='#c87533';ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(-coilW,-coilH);ctx.lineTo(coilW,-coilH);ctx.lineTo(coilW,coilH);ctx.lineTo(-coilW,coilH);ctx.closePath();
    ctx.stroke();

    // Force arrows on coil sides
    if(I>0){
        const forceDir=Math.sin(angle);
        const fLen=40*I/10;
        // Left side force
        ctx.beginPath();ctx.moveTo(-coilW,0);ctx.lineTo(-coilW,-forceDir*fLen);
        ctx.strokeStyle='#28a745';ctx.lineWidth=3;ctx.stroke();
        ctx.beginPath();ctx.moveTo(-coilW,-forceDir*fLen);
        ctx.lineTo(-coilW-5,-forceDir*fLen+forceDir*8);ctx.lineTo(-coilW+5,-forceDir*fLen+forceDir*8);
        ctx.closePath();ctx.fillStyle='#28a745';ctx.fill();
        // Right side force (opposite)
        ctx.beginPath();ctx.moveTo(coilW,0);ctx.lineTo(coilW,forceDir*fLen);
        ctx.strokeStyle='#28a745';ctx.lineWidth=3;ctx.stroke();
        ctx.beginPath();ctx.moveTo(coilW,forceDir*fLen);
        ctx.lineTo(coilW-5,forceDir*fLen-forceDir*8);ctx.lineTo(coilW+5,forceDir*fLen-forceDir*8);
        ctx.closePath();ctx.fillStyle='#28a745';ctx.fill();
    }
    ctx.restore();

    // Commutator
    ctx.beginPath();ctx.arc(cx,cy+coilH+30,15,0,Math.PI);
    ctx.fillStyle=Math.sin(angle)>0?'#c87533':'#a05a20';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy+coilH+30,15,Math.PI,Math.PI*2);
    ctx.fillStyle=Math.sin(angle)>0?'#a05a20':'#c87533';ctx.fill();
    ctx.fillStyle='#4a5568';ctx.font='500 11px Outfit';ctx.textAlign='center';
    ctx.fillText('Commutator',cx,cy+coilH+60);

    // Brushes
    ctx.fillStyle='#4a4a4a';ctx.fillRect(cx-25,cy+coilH+25,8,20);ctx.fillRect(cx+17,cy+coilH+25,8,20);
    ctx.fillStyle='#4a5568';ctx.font='500 10px Outfit';
    ctx.fillText('Brushes',cx,cy+coilH+75);

    // Axle
    ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#4a5568';ctx.fill();

    // Labels
    ctx.fillStyle='#1835b4';ctx.font='600 14px Oswald';ctx.textAlign='center';
    ctx.fillText('DC MOTOR',cx,30);
    if(I>0){ctx.fillStyle='#28a745';ctx.font='500 12px Outfit';ctx.fillText('Force (motor effect)',cx-coilW-60,cy)}

    requestAnimationFrame(draw);
}
resize();window.addEventListener('resize',resize);requestAnimationFrame(draw);
</script>
</body>
</html>
