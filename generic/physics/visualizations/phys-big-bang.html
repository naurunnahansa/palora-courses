<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Big Bang & Expanding Universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',system-ui,sans-serif;background:#FFF;padding:10px 12px;color:#1a1f2e}.container{max-width:550px;margin:0 auto}h1{font-family:'Oswald',sans-serif;font-size:1.0rem;color:#637EA1;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.card{border-radius:5px;border:1px solid #e5dfe0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:8px;margin-bottom:10px;background:#fff}canvas{display:block;margin:0 auto;border-radius:4px;background:#1a1f2e}.slider-row{margin:8px 0}.slider-label{display:flex;justify-content:space-between;font-size:.8rem;color:#4a5568;margin-bottom:2px}.slider-label .val{font-weight:600;color:#637EA1}input[type="range"]{width:100%;accent-color:#637EA1}.info{background:#fafbfc;border-radius:5px;padding:8px;font-size:.75rem;color:#4a5568;text-align:center;margin-top:8px}.info strong{color:#637EA1}</style>
</head>
<body>
<div class="container">
    <h1>The Big Bang & Expanding Universe</h1>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="500"></canvas></div>
    <div class="card">
        <div class="slider-row"><div class="slider-label"><span>Time since Big Bang</span><span class="val" id="tLabel">0 years</span></div><input type="range" id="tSlider" min="0" max="100" value="0"></div>
    </div>
    <div class="info"><strong>Evidence for the Big Bang:</strong> Red-shift of distant galaxies shows the universe is expanding. The <strong>Cosmic Microwave Background Radiation (CMBR)</strong> is leftover thermal radiation from the early universe.</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let lastTs=0,animT=0;

const galaxies=[];
for(let i=0;i<30;i++){
    galaxies.push({
        angle:Math.random()*Math.PI*2,
        dist:0.2+Math.random()*0.8,
        size:2+Math.random()*3,
        hue:Math.floor(Math.random()*360),
        rotSpeed:0.1+Math.random()*0.3
    });
}

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*500/1060)+'px'}

function draw(ts){
    const dt=lastTs?(ts-lastTs)/1000:0;lastTs=ts;animT+=dt;
    const t=parseInt(document.getElementById('tSlider').value)/100;
    const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;

    // Time label
    const ages=['0','380,000','200 million','4.6 billion','9.8 billion','13.8 billion'];
    const labels=['Big Bang','First light (CMBR)','First stars form','Solar System forms','Sun halfway through life','Today'];
    const idx=Math.min(5,Math.floor(t*5.99));
    document.getElementById('tLabel').textContent=ages[idx]+' years — '+labels[idx];

    ctx.clearRect(0,0,W,H);

    // Background gets darker over time (early universe was hot/bright)
    const bgBright=Math.max(0,(0.3-t*0.3));
    ctx.fillStyle=`rgb(${26+bgBright*200},${31+bgBright*180},${46+bgBright*100})`;ctx.fillRect(0,0,W,H);

    // CMBR glow in early universe
    if(t<0.2){
        const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,200*(t*5+0.1));
        grd.addColorStop(0,`rgba(244,211,94,${0.5*(1-t*5)})`);grd.addColorStop(1,'rgba(244,211,94,0)');
        ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    }

    // Expanding universe - galaxies move outward
    const expansion=0.05+t*0.95;

    if(t>0.05){
        galaxies.forEach(g=>{
            const d=g.dist*expansion*Math.min(cx,cy)*0.9;
            const gx=cx+Math.cos(g.angle)*d;
            const gy=cy+Math.sin(g.angle)*d;

            if(gx<-20||gx>W+20||gy<-20||gy>H+20)return;

            // Red-shift: further galaxies appear more red
            const redshift=Math.min(1,g.dist*t);
            const r=200+redshift*55;const gr=180-redshift*100;const b=255-redshift*200;

            // Galaxy spiral
            ctx.save();ctx.translate(gx,gy);ctx.rotate(animT*g.rotSpeed);
            for(let j=0;j<3;j++){
                const sa=j*Math.PI*2/3;
                ctx.beginPath();
                for(let k=0;k<15;k++){
                    const sr=k*0.8;const ang=sa+k*0.3;
                    const sx=Math.cos(ang)*sr,sy=Math.sin(ang)*sr;
                    k===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);
                }
                ctx.strokeStyle=`rgba(${r},${gr},${b},0.6)`;ctx.lineWidth=1.5;ctx.stroke();
            }
            ctx.beginPath();ctx.arc(0,0,g.size*0.6,0,Math.PI*2);
            ctx.fillStyle=`rgba(${r},${gr},${b},0.8)`;ctx.fill();
            ctx.restore();
        });
    }

    // Big Bang point at t=0
    if(t<0.1){
        const bangR=5+t*100;
        ctx.beginPath();ctx.arc(cx,cy,bangR,0,Math.PI*2);
        const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,bangR);
        grd.addColorStop(0,`rgba(255,255,255,${1-t*10})`);
        grd.addColorStop(0.5,`rgba(244,211,94,${0.8-t*8})`);
        grd.addColorStop(1,`rgba(220,53,69,${0.5-t*5})`);
        ctx.fillStyle=grd;ctx.fill();
    }

    // Timeline at bottom
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(50,H-30,W-100,4);
    ctx.fillStyle='#F4D35E';ctx.fillRect(50,H-30,(W-100)*t,4);
    ctx.beginPath();ctx.arc(50+(W-100)*t,H-28,6,0,Math.PI*2);ctx.fillStyle='#F4D35E';ctx.fill();

    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='500 10px Outfit';ctx.textAlign='center';
    ctx.fillText('13.8 billion years ago',80,H-8);
    ctx.fillText('Today',W-60,H-8);

    // Title
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='600 14px Oswald';ctx.textAlign='center';
    ctx.fillText('THE EXPANDING UNIVERSE',cx,25);

    // Red-shift indicator
    if(t>0.3){
        ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='500 10px Outfit';ctx.textAlign='right';
        ctx.fillText('Distant galaxies appear redder (red-shift)',W-20,50);
    }

    requestAnimationFrame(draw);
}
resize();window.addEventListener('resize',resize);requestAnimationFrame(draw);
</script>
</body>
</html>
