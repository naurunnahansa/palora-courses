<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Stores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', system-ui, sans-serif; background: #FFFFFF; padding: 10px 12px; color: #1a1f2e; }
        .container { max-width: 550px; margin: 0 auto; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 1.0rem; color: #637EA1; text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .subtitle { text-align: center; font-size: 0.78rem; color: #4a5568; margin-bottom: 10px; }
        .score-bar { display: flex; justify-content: space-between; background: #F5E6E8; border-radius: 5px; padding: 6px 12px; margin-bottom: 10px; font-size: 0.8rem; font-weight: 600; }
        .score-bar span { color: #637EA1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .store-card { border: 2px solid #e5dfe0; border-radius: 5px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fff; }
        .store-card:hover { border-color: #637EA1; transform: translateY(-1px); }
        .store-card.active { border-color: #637EA1; background: #f0f4f8; }
        .store-card .icon { font-size: 1.5rem; margin-bottom: 4px; }
        .store-card .name { font-family: 'Oswald', sans-serif; font-size: 0.82rem; color: #637EA1; text-transform: uppercase; letter-spacing: 0.03em; }
        .store-card .desc { font-size: 0.68rem; color: #4a5568; margin-top: 3px; }
        .detail { border: 1px solid #e5dfe0; border-radius: 5px; padding: 12px; background: #F5E6E8; }
        .detail .title { font-family: 'Oswald', sans-serif; font-size: 0.9rem; color: #637EA1; text-transform: uppercase; margin-bottom: 4px; }
        .detail .text { font-size: 0.78rem; color: #4a5568; line-height: 1.5; }
        .detail .examples { margin-top: 6px; }
        .detail .example { display: inline-block; background: #fff; border: 1px solid #e5dfe0; border-radius: 4px; padding: 3px 8px; font-size: 0.72rem; margin: 2px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Energy Stores</h1>
    <p class="subtitle">Click each store to learn more</p>
    <div class="grid" id="grid"></div>
    <div class="detail" id="detail">
        <div class="title">Select an energy store above</div>
        <div class="text">There are 8 main energy stores in physics. Click one to see its description and real-world examples.</div>
    </div>
</div>
<script>
const stores = [
    { icon: '🏃', name: 'Kinetic', desc: 'Energy of movement', detail: 'Any moving object has kinetic energy. The faster it moves and the greater its mass, the more kinetic energy it has.', formula: 'KE = ½mv²', examples: ['Moving car', 'Running person', 'Spinning wheel', 'Wind'] },
    { icon: '⬆', name: 'Gravitational PE', desc: 'Energy due to height', detail: 'An object raised above ground level has gravitational potential energy. The higher and heavier, the more energy stored.', formula: 'GPE = mgh', examples: ['Book on shelf', 'Water behind dam', 'Roller coaster at top', 'Skydiver in plane'] },
    { icon: '🔧', name: 'Elastic PE', desc: 'Energy in stretched/compressed objects', detail: 'When a spring, rubber band, or other elastic material is stretched or compressed, energy is stored.', formula: 'EPE = ½kx²', examples: ['Stretched spring', 'Drawn bow', 'Compressed ball', 'Trampoline'] },
    { icon: '🌡', name: 'Thermal', desc: 'Energy from particle movement', detail: 'The total kinetic energy of all particles in an object. Hotter objects have more thermal energy.', formula: 'Q = mcΔT', examples: ['Hot coffee', 'Warm radiator', 'Friction heat', 'Sunlit pavement'] },
    { icon: '🔋', name: 'Chemical', desc: 'Energy stored in bonds', detail: 'Energy stored in the chemical bonds of substances. Released during chemical reactions like burning or digestion.', formula: 'Released in reactions', examples: ['Food', 'Batteries', 'Fossil fuels', 'Biomass'] },
    { icon: '☢', name: 'Nuclear', desc: 'Energy in atomic nuclei', detail: 'Energy stored in the nucleus of an atom. Released during nuclear fission (splitting) or fusion (joining) reactions.', formula: 'E = mc²', examples: ['Uranium fuel', 'The Sun (fusion)', 'Nuclear reactor', 'Radioactive decay'] },
    { icon: '⚡', name: 'Electrostatic', desc: 'Energy from electric charges', detail: 'Energy stored due to the positions of charged particles. Like charges repel and unlike charges attract, storing energy.', formula: 'E = QV', examples: ['Charged balloon', 'Lightning clouds', 'Capacitor', 'Van de Graaff'] },
    { icon: '🧲', name: 'Magnetic', desc: 'Energy in magnetic fields', detail: 'Energy stored in the magnetic field between magnets or around electromagnets.', formula: 'E = ½LI²', examples: ['Fridge magnets', 'MRI scanner', 'Maglev train', 'Electromagnet crane'] }
];

const grid = document.getElementById('grid');
stores.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'store-card';
    card.innerHTML = `<div class="icon">${s.icon}</div><div class="name">${s.name}</div><div class="desc">${s.desc}</div>`;
    card.onclick = () => {
        document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const exHtml = s.examples.map(e => `<span class="example">${e}</span>`).join('');
        document.getElementById('detail').innerHTML = `
            <div class="title">${s.icon} ${s.name} Energy</div>
            <div class="text">${s.detail}</div>
            <div class="text" style="margin-top:4px;"><strong>Key formula:</strong> ${s.formula}</div>
            <div class="examples"><strong style="font-size:0.72rem;color:#4a5568;">Examples:</strong><br>${exHtml}</div>`;
    };
    grid.appendChild(card);
});
</script>
</body>
</html>
