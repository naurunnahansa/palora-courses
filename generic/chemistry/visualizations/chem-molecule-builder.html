<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Molecule Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#f0f2f5;color:#1a1f2e;min-height:100vh;display:flex;justify-content:center;padding:20px;}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.5px;}
.container{max-width:550px;width:100%;margin:0 auto;}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,0.08);border:1px solid #e5dfe0;padding:24px;margin-bottom:16px;}
.card-title{font-size:1.3rem;color:#637EA1;margin-bottom:4px;}
.card-subtitle{font-size:0.85rem;color:#888;margin-bottom:16px;}
canvas{width:100%;background:#fafbfc;border-radius:10px;border:1px solid #e5dfe0;display:block;margin:10px 0;}
.btn{background:#637EA1;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-family:'Outfit',sans-serif;font-size:0.9rem;cursor:pointer;transition:all 0.2s;}
.btn:hover{background:#506a8a;}
select{font-family:'Outfit',sans-serif;font-size:0.95rem;padding:10px 14px;border-radius:8px;border:1.5px solid #e5dfe0;background:#fff;color:#1a1f2e;width:100%;cursor:pointer;outline:none;transition:border 0.2s;}
select:focus{border-color:#637EA1;}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:0.88rem;}
.info-row:last-child{border-bottom:none;}
.info-label{color:#888;font-weight:500;}
.info-value{color:#1a1f2e;font-weight:600;}
.highlight{color:#637EA1;font-weight:700;}
.badge{display:inline-block;background:#F5E6E8;color:#637EA1;padding:3px 10px;border-radius:12px;font-size:0.78rem;font-weight:600;}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2 class="card-title">Organic Molecule Viewer</h2>
    <p class="card-subtitle">Select a molecule to view its 2D structural formula</p>
    <select id="molSelect"></select>
    <canvas id="canvas" width="510" height="300"></canvas>
    <div id="infoPanel"></div>
  </div>
</div>
<script>
const molecules = {
  methane:    { name:'Methane',       formula:'CH\u2084',         series:'Alkanes',          funcGroup:'None',          carbons:[{h:4}] },
  ethane:     { name:'Ethane',        formula:'C\u2082H\u2086',   series:'Alkanes',          funcGroup:'None',          carbons:[{h:3},{h:3}] },
  propane:    { name:'Propane',       formula:'C\u2083H\u2088',   series:'Alkanes',          funcGroup:'None',          carbons:[{h:3},{h:2},{h:3}] },
  butane:     { name:'Butane',        formula:'C\u2084H\u2081\u2080', series:'Alkanes',      funcGroup:'None',          carbons:[{h:3},{h:2},{h:2},{h:3}] },
  ethene:     { name:'Ethene',        formula:'C\u2082H\u2084',   series:'Alkenes',          funcGroup:'C=C double bond', carbons:[{h:2},{h:2}], doubleBond:[0] },
  propene:    { name:'Propene',       formula:'C\u2083H\u2086',   series:'Alkenes',          funcGroup:'C=C double bond', carbons:[{h:2},{h:1},{h:3}], doubleBond:[0] },
  methanol:   { name:'Methanol',      formula:'CH\u2083OH',       series:'Alcohols',         funcGroup:'-OH (hydroxyl)', carbons:[{h:3}], oh:true },
  ethanol:    { name:'Ethanol',       formula:'C\u2082H\u2085OH', series:'Alcohols',         funcGroup:'-OH (hydroxyl)', carbons:[{h:3},{h:2}], oh:true },
  ethanoic_acid:{ name:'Ethanoic Acid', formula:'CH\u2083COOH',  series:'Carboxylic Acids', funcGroup:'-COOH (carboxyl)', carbons:[{h:3},{h:0}], cooh:true }
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 510; canvas.height = 300;
const sel = document.getElementById('molSelect');

Object.keys(molecules).forEach(k => {
  const o = document.createElement('option');
  o.value = k; o.textContent = molecules[k].name;
  sel.appendChild(o);
});

sel.addEventListener('change', draw);

function draw() {
  const mol = molecules[sel.value];
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);

  const n = mol.carbons.length;
  const bondLen = 55;
  const totalW = (n - 1) * bondLen + (mol.oh ? 50 : 0) + (mol.cooh ? 60 : 0);
  const sx = W / 2 - totalW / 2;
  const sy = H / 2;

  const positions = [];
  for (let i = 0; i < n; i++) positions.push({ x: sx + i * bondLen, y: sy });

  ctx.lineWidth = 2; ctx.lineCap = 'round';

  // C-C bonds
  for (let i = 0; i < n - 1; i++) {
    const isDbl = mol.doubleBond && mol.doubleBond.includes(i);
    if (isDbl) {
      ctx.strokeStyle = '#637EA1'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(positions[i].x, positions[i].y - 5); ctx.lineTo(positions[i+1].x, positions[i+1].y - 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(positions[i].x, positions[i].y + 5); ctx.lineTo(positions[i+1].x, positions[i+1].y + 5); ctx.stroke();
      ctx.lineWidth = 2;
    } else {
      ctx.strokeStyle = '#1a1f2e';
      ctx.beginPath(); ctx.moveTo(positions[i].x, positions[i].y); ctx.lineTo(positions[i+1].x, positions[i+1].y); ctx.stroke();
    }
  }

  // H atoms
  ctx.font = '500 12px Outfit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  positions.forEach((p, i) => {
    const hc = mol.carbons[i].h;
    const dirs = [];
    if (hc >= 1) dirs.push({dx:0,dy:-30});
    if (hc >= 2) dirs.push({dx:0,dy:30});
    if (hc >= 3) {
      if (i === 0 && n > 1) dirs.push({dx:-30,dy:0});
      else if (i === n-1) dirs.push({dx:30,dy:0});
      else dirs.push({dx:-30,dy:0});
    }
    if (hc >= 4) dirs.push({dx:-30,dy:0});
    dirs.forEach(d => {
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+d.dx*0.6, p.y+d.dy*0.6); ctx.stroke();
      ctx.fillStyle = '#888';
      ctx.fillText('H', p.x+d.dx, p.y+d.dy);
    });
  });

  // OH group
  if (mol.oh) {
    const last = positions[n-1];
    ctx.strokeStyle = '#637EA1'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x+35, last.y); ctx.stroke();
    ctx.fillStyle = '#637EA1'; ctx.font = '700 14px Outfit';
    ctx.fillText('O', last.x+45, last.y);
    ctx.beginPath(); ctx.moveTo(last.x+45, last.y+8); ctx.lineTo(last.x+45, last.y+28); ctx.stroke();
    ctx.fillText('H', last.x+45, last.y+38);
  }

  // COOH group
  if (mol.cooh) {
    const last = positions[n-1];
    ctx.strokeWidth = 2.5; ctx.strokeStyle = '#637EA1'; ctx.lineWidth = 2.5;
    // =O above
    ctx.beginPath(); ctx.moveTo(last.x-3, last.y-8); ctx.lineTo(last.x-3, last.y-32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(last.x+3, last.y-8); ctx.lineTo(last.x+3, last.y-32); ctx.stroke();
    ctx.fillStyle = '#637EA1'; ctx.font = '700 14px Outfit';
    ctx.fillText('O', last.x, last.y-44);
    // -OH right
    ctx.beginPath(); ctx.moveTo(last.x+8, last.y); ctx.lineTo(last.x+38, last.y); ctx.stroke();
    ctx.fillText('O', last.x+48, last.y);
    ctx.beginPath(); ctx.moveTo(last.x+48, last.y+8); ctx.lineTo(last.x+48, last.y+28); ctx.stroke();
    ctx.fillText('H', last.x+48, last.y+38);
  }

  // C labels
  ctx.font = '700 15px Outfit';
  positions.forEach(p => {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1f2e';
    ctx.fillText('C', p.x, p.y);
  });

  ctx.fillStyle = '#637EA1'; ctx.font = '600 13px Outfit'; ctx.textAlign = 'left';
  ctx.fillText(mol.name, 14, 22);

  // Info panel
  document.getElementById('infoPanel').innerHTML =
    '<div class="info-row"><span class="info-label">Molecular Formula</span><span class="info-value">' + mol.formula + '</span></div>' +
    '<div class="info-row"><span class="info-label">Homologous Series</span><span class="info-value"><span class="badge">' + mol.series + '</span></span></div>' +
    '<div class="info-row"><span class="info-label">Functional Group</span><span class="info-value highlight">' + mol.funcGroup + '</span></div>';
}

draw();
</script>
</body>
</html>
