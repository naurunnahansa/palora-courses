<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table Explorer</title>
    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a2747; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  h1, h2, h3 { font-family: system-ui, -apple-system, sans-serif; }
  .container { max-width: 100%; width: 100%; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); border: 1px solid #d4d8e5; padding: 24px; margin-bottom: 18px; }
  h1 { color: #1835b4; font-size: 1.5rem; text-align: center; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 16px; }
  .btn { background: #1835b4; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; transition: background 0.2s; }
  .btn:hover { background: #4f6a8a; }
  .chip { display: inline-block; padding: 6px 12px; border-radius: 20px; border: 1.5px solid #d4d8e5; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; margin: 3px; background: #fff; user-select: none; }
  .chip:hover, .chip.active { background: #1835b4; color: #fff; border-color: #1835b4; }
  .info-box { background: #e8ecf8; border-radius: 10px; padding: 14px; margin-top: 14px; font-size: 0.85rem; line-height: 1.6; }
  .info-box strong { color: #1835b4; }
  .pt-grid { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; margin-bottom: 14px; }
  .el-cell { aspect-ratio: 1; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 0.6rem; border: 1.5px solid transparent; transition: all 0.2s; position: relative; }
  .el-cell:hover { transform: scale(1.15); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .el-cell.selected { border-color: #1a2747; box-shadow: 0 0 0 2px #1835b4; }
  .el-cell .sym { font-weight: 700; font-size: 0.75rem; line-height: 1; font-family: system-ui, -apple-system, sans-serif; }
  .el-cell .num { font-size: 0.5rem; color: rgba(0,0,0,0.5); }
  .el-cell.empty { background: transparent !important; cursor: default; }
  .el-cell.empty:hover { transform: none; box-shadow: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .detail-item { background: #fafbfc; border-radius: 8px; padding: 8px; border: 1px solid #d4d8e5; }
  .detail-item .label { font-size: 0.65rem; color: #888; text-transform: uppercase; font-weight: 600; }
  .detail-item .value { font-family: system-ui, -apple-system, sans-serif; font-size: 1rem; color: #1835b4; }
  .el-big { text-align: center; margin-bottom: 10px; }
  .el-big .sym { font-family: system-ui, -apple-system, sans-serif; font-size: 3rem; color: #1835b4; }
  .el-big .name { font-size: 1rem; color: #1a2747; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Periodic Table Explorer</h1>
    <p class="subtitle">Click any element to explore its properties</p>
    <div class="legend" id="legend"></div>
    <div class="pt-grid" id="ptGrid"></div>
  </div>
  <div class="card" id="detailCard">
    <div class="el-big" id="elBig"><div class="sym">?</div><div class="name">Select an element</div></div>
    <div class="detail-grid" id="detailGrid"></div>
    <div class="info-box" id="infoBox">Click on an element in the periodic table above to see its details.</div>
  </div>
</div>

<script>
const groups = {
  'alkali': { color: '#e74c3c', label: 'Alkali Metals' },
  'alkaline': { color: '#e67e22', label: 'Alkaline Earth' },
  'transition': { color: '#f39c12', label: 'Transition Metals' },
  'nonmetal': { color: '#3498db', label: 'Non-metals' },
  'halogen': { color: '#27ae60', label: 'Halogens' },
  'noble': { color: '#8e44ad', label: 'Noble Gases' },
  'metalloid': { color: '#1abc9c', label: 'Metalloids' },
  'post-transition': { color: '#95a5a6', label: 'Post-transition' },
};

const elements = [
  { z:1, sym:'H', name:'Hydrogen', mass:1, config:'1', group:1, period:1, cat:'nonmetal', props:'Colourless gas. Most abundant element in the universe. Highly flammable.', row:1, col:1 },
  { z:2, sym:'He', name:'Helium', mass:4, config:'2', group:18, period:1, cat:'noble', props:'Colourless, odourless noble gas. Very low density. Used in balloons.', row:1, col:18 },
  { z:3, sym:'Li', name:'Lithium', mass:7, config:'2,1', group:1, period:2, cat:'alkali', props:'Soft, silvery metal. Lightest metal. Reacts gently with water.', row:2, col:1 },
  { z:4, sym:'Be', name:'Beryllium', mass:9, config:'2,2', group:2, period:2, cat:'alkaline', props:'Hard, grey metal. Relatively unreactive. Toxic.', row:2, col:2 },
  { z:5, sym:'B', name:'Boron', mass:11, config:'2,3', group:13, period:2, cat:'metalloid', props:'Metalloid. Hard, dark solid. Used in glass and detergents.', row:2, col:13 },
  { z:6, sym:'C', name:'Carbon', mass:12, config:'2,4', group:14, period:2, cat:'nonmetal', props:'Non-metal. Exists as diamond, graphite, fullerenes. Basis of organic chemistry.', row:2, col:14 },
  { z:7, sym:'N', name:'Nitrogen', mass:14, config:'2,5', group:15, period:2, cat:'nonmetal', props:'Colourless gas. Makes up 78% of air. Essential for proteins and DNA.', row:2, col:15 },
  { z:8, sym:'O', name:'Oxygen', mass:16, config:'2,6', group:16, period:2, cat:'nonmetal', props:'Colourless gas. Essential for respiration and combustion. 21% of air.', row:2, col:16 },
  { z:9, sym:'F', name:'Fluorine', mass:19, config:'2,7', group:17, period:2, cat:'halogen', props:'Pale yellow gas. Most reactive non-metal. Most electronegative element.', row:2, col:17 },
  { z:10, sym:'Ne', name:'Neon', mass:20, config:'2,8', group:18, period:2, cat:'noble', props:'Colourless noble gas. Used in lighting (red-orange glow).', row:2, col:18 },
  { z:11, sym:'Na', name:'Sodium', mass:23, config:'2,8,1', group:1, period:3, cat:'alkali', props:'Soft, silvery metal. Reacts vigorously with water. Stored in oil.', row:3, col:1 },
  { z:12, sym:'Mg', name:'Magnesium', mass:24, config:'2,8,2', group:2, period:3, cat:'alkaline', props:'Light, silvery metal. Burns with bright white flame. Used in alloys.', row:3, col:2 },
  { z:13, sym:'Al', name:'Aluminium', mass:27, config:'2,8,3', group:13, period:3, cat:'post-transition', props:'Light, silvery metal. Good conductor. Oxide layer prevents corrosion.', row:3, col:13 },
  { z:14, sym:'Si', name:'Silicon', mass:28, config:'2,8,4', group:14, period:3, cat:'metalloid', props:'Metalloid. Used in computer chips and glass. Second most abundant in crust.', row:3, col:14 },
  { z:15, sym:'P', name:'Phosphorus', mass:31, config:'2,8,5', group:15, period:3, cat:'nonmetal', props:'Non-metal. White phosphorus glows and is very reactive. Essential for life.', row:3, col:15 },
  { z:16, sym:'S', name:'Sulfur', mass:32, config:'2,8,6', group:16, period:3, cat:'nonmetal', props:'Yellow solid non-metal. Burns with blue flame. Found near volcanoes.', row:3, col:16 },
  { z:17, sym:'Cl', name:'Chlorine', mass:35.5, config:'2,8,7', group:17, period:3, cat:'halogen', props:'Green-yellow gas. Pungent smell. Used to sterilise water.', row:3, col:17 },
  { z:18, sym:'Ar', name:'Argon', mass:40, config:'2,8,8', group:18, period:3, cat:'noble', props:'Colourless noble gas. Most abundant noble gas in atmosphere. Used in welding.', row:3, col:18 },
  { z:19, sym:'K', name:'Potassium', mass:39, config:'2,8,8,1', group:1, period:4, cat:'alkali', props:'Very soft, silvery metal. Reacts very vigorously with water (lilac flame).', row:4, col:1 },
  { z:20, sym:'Ca', name:'Calcium', mass:40, config:'2,8,8,2', group:2, period:4, cat:'alkaline', props:'Silvery metal. Reacts with water. Essential for bones and teeth.', row:4, col:2 },
  { z:21, sym:'Sc', name:'Scandium', mass:45, config:'2,8,9,2', group:3, period:4, cat:'transition', props:'Silvery transition metal. Lightweight. Used in aerospace alloys.', row:4, col:3 },
  { z:22, sym:'Ti', name:'Titanium', mass:48, config:'2,8,10,2', group:4, period:4, cat:'transition', props:'Strong, light transition metal. Corrosion-resistant. Used in implants.', row:4, col:4 },
  { z:24, sym:'Cr', name:'Chromium', mass:52, config:'2,8,13,1', group:6, period:4, cat:'transition', props:'Hard, shiny metal. Used in stainless steel and chrome plating.', row:4, col:6 },
  { z:25, sym:'Mn', name:'Manganese', mass:55, config:'2,8,13,2', group:7, period:4, cat:'transition', props:'Hard, brittle metal. Used in steel production. Many oxidation states.', row:4, col:7 },
  { z:26, sym:'Fe', name:'Iron', mass:56, config:'2,8,14,2', group:8, period:4, cat:'transition', props:'Most used metal. Magnetic. Forms rust (iron oxide) when exposed to water/air.', row:4, col:8 },
  { z:29, sym:'Cu', name:'Copper', mass:63.5, config:'2,8,18,1', group:11, period:4, cat:'transition', props:'Reddish metal. Excellent conductor. Used in wiring and plumbing.', row:4, col:11 },
  { z:30, sym:'Zn', name:'Zinc', mass:65, config:'2,8,18,2', group:12, period:4, cat:'transition', props:'Bluish-white metal. Used in galvanising iron and in batteries.', row:4, col:12 },
  { z:35, sym:'Br', name:'Bromine', mass:80, config:'2,8,18,7', group:17, period:4, cat:'halogen', props:'Red-brown liquid. Only non-metal liquid at room temperature. Pungent.', row:4, col:17 },
  { z:36, sym:'Kr', name:'Krypton', mass:84, config:'2,8,18,8', group:18, period:4, cat:'noble', props:'Colourless noble gas. Used in specialist lighting.', row:4, col:18 },
  { z:53, sym:'I', name:'Iodine', mass:127, config:'2,8,18,18,7', group:17, period:5, cat:'halogen', props:'Dark grey/purple solid. Sublimes to purple vapour. Used as antiseptic.', row:5, col:17 },
];

function buildLegend() {
  const legend = document.getElementById('legend');
  Object.entries(groups).forEach(([key, g]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-swatch" style="background:${g.color}"></div>${g.label}`;
    legend.appendChild(item);
  });
}

function buildGrid() {
  const grid = document.getElementById('ptGrid');
  for (let r = 1; r <= 5; r++) {
    for (let c = 1; c <= 18; c++) {
      const el = elements.find(e => e.row === r && e.col === c);
      const cell = document.createElement('div');
      if (el) {
        const g = groups[el.cat];
        cell.className = 'el-cell';
        cell.style.background = g.color + '33';
        cell.style.color = g.color;
        cell.innerHTML = `<span class="num">${el.z}</span><span class="sym">${el.sym}</span>`;
        cell.addEventListener('click', () => showDetail(el));
        cell.dataset.z = el.z;
      } else {
        cell.className = 'el-cell empty';
      }
      grid.appendChild(cell);
    }
  }
}

function showDetail(el) {
  document.querySelectorAll('.el-cell').forEach(c => c.classList.remove('selected'));
  const cell = document.querySelector(`.el-cell[data-z="${el.z}"]`);
  if (cell) cell.classList.add('selected');

  const g = groups[el.cat];
  document.getElementById('elBig').innerHTML = `<div class="sym" style="color:${g.color}">${el.sym}</div><div class="name">${el.name}</div>`;

  const details = [
    { label: 'Atomic Number', value: el.z },
    { label: 'Mass Number', value: el.mass },
    { label: 'Electronic Config', value: el.config },
    { label: 'Group', value: el.group },
    { label: 'Period', value: el.period },
    { label: 'Category', value: g.label },
  ];

  const grid = document.getElementById('detailGrid');
  grid.innerHTML = '';
  details.forEach(d => {
    const item = document.createElement('div');
    item.className = 'detail-item';
    item.innerHTML = `<div class="label">${d.label}</div><div class="value">${d.value}</div>`;
    grid.appendChild(item);
  });

  document.getElementById('infoBox').innerHTML = `<strong>Properties:</strong> ${el.props}`;
}

buildLegend();
buildGrid();
</script>
</body>
</html>
