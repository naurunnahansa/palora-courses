<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Trends Visualiser</title>
    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a2747; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  h1, h2, h3 { font-family: system-ui, -apple-system, sans-serif; }
  .container { max-width: 100%; width: 100%; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); border: 1px solid #d4d8e5; padding: 24px; margin-bottom: 18px; }
  h1 { color: #1835b4; font-size: 1.5rem; text-align: center; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 16px; }
  .btn { background: #1835b4; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; transition: background 0.2s; }
  .btn:hover { background: #4f6a8a; }
  .chip { display: inline-block; padding: 6px 12px; border-radius: 20px; border: 1.5px solid #d4d8e5; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; margin: 3px; background: #fff; user-select: none; }
  .chip:hover, .chip.active { background: #1835b4; color: #fff; border-color: #1835b4; }
  .info-box { background: #e8ecf8; border-radius: 10px; padding: 14px; margin-top: 14px; font-size: 0.85rem; line-height: 1.6; }
  .info-box strong { color: #1835b4; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-bottom: 14px; }
  .pt-grid { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; }
  .el-cell { aspect-ratio: 1; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.55rem; position: relative; transition: all 0.3s; }
  .el-cell .sym { font-weight: 700; font-size: 0.7rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1; }
  .el-cell .num { font-size: 0.45rem; opacity: 0.6; }
  .el-cell.empty { background: transparent !important; }
  .arrow-overlay { position: relative; margin-top: 14px; }
  .arrow-h, .arrow-v { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #1835b4; font-weight: 600; }
  .arrow-h { justify-content: center; margin-bottom: 8px; }
  .arrow-bar-h { height: 4px; flex: 1; max-width: 200px; border-radius: 2px; }
  .legend-bar { height: 14px; border-radius: 4px; margin-top: 10px; }
  .legend-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: #888; margin-top: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Periodic Trends Visualiser</h1>
    <p class="subtitle">Toggle overlays to see how properties change across the table</p>
    <div class="chip-row" id="trendChips"></div>
    <div class="pt-grid" id="ptGrid"></div>
    <div class="legend-bar" id="legendBar" style="background: linear-gradient(to right, #3498db, #e74c3c);"></div>
    <div class="legend-labels"><span id="legendLow">Low</span><span id="legendHigh">High</span></div>
  </div>
  <div class="card">
    <div class="arrow-h" id="arrowH" style="display:none;">
      <span id="arrowHLeft"></span>
      <div class="arrow-bar-h" id="arrowHBar"></div>
      <span id="arrowHRight"></span>
    </div>
    <div class="info-box" id="infoBox">Select a trend above to visualise it on the periodic table.</div>
  </div>
</div>

<script>
const elements = [
  { z:1, sym:'H', row:1, col:1 }, { z:2, sym:'He', row:1, col:18 },
  { z:3, sym:'Li', row:2, col:1 }, { z:4, sym:'Be', row:2, col:2 },
  { z:5, sym:'B', row:2, col:13 }, { z:6, sym:'C', row:2, col:14 },
  { z:7, sym:'N', row:2, col:15 }, { z:8, sym:'O', row:2, col:16 },
  { z:9, sym:'F', row:2, col:17 }, { z:10, sym:'Ne', row:2, col:18 },
  { z:11, sym:'Na', row:3, col:1 }, { z:12, sym:'Mg', row:3, col:2 },
  { z:13, sym:'Al', row:3, col:13 }, { z:14, sym:'Si', row:3, col:14 },
  { z:15, sym:'P', row:3, col:15 }, { z:16, sym:'S', row:3, col:16 },
  { z:17, sym:'Cl', row:3, col:17 }, { z:18, sym:'Ar', row:3, col:18 },
  { z:19, sym:'K', row:4, col:1 }, { z:20, sym:'Ca', row:4, col:2 },
  { z:21, sym:'Sc', row:4, col:3 }, { z:22, sym:'Ti', row:4, col:4 },
  { z:23, sym:'V', row:4, col:5 }, { z:24, sym:'Cr', row:4, col:6 },
  { z:25, sym:'Mn', row:4, col:7 }, { z:26, sym:'Fe', row:4, col:8 },
  { z:27, sym:'Co', row:4, col:9 }, { z:28, sym:'Ni', row:4, col:10 },
  { z:29, sym:'Cu', row:4, col:11 }, { z:30, sym:'Zn', row:4, col:12 },
  { z:31, sym:'Ga', row:4, col:13 }, { z:32, sym:'Ge', row:4, col:14 },
  { z:33, sym:'As', row:4, col:15 }, { z:34, sym:'Se', row:4, col:16 },
  { z:35, sym:'Br', row:4, col:17 }, { z:36, sym:'Kr', row:4, col:18 },
];

// Approximate normalised values (0-1) for trends
const trendData = {
  atomic_radius: {
    label: 'Atomic Radius', lowLabel: 'Small', highLabel: 'Large',
    gradientL: '#f9e79f', gradientR: '#e74c3c',
    hArrow: 'Decreases \u2192', hArrowReverse: true,
    vArrow: 'Increases \u2193',
    info: '<strong>Atomic Radius</strong> increases going <strong>down a group</strong> (more electron shells) and <strong>decreases across a period</strong> (more protons pulling electrons closer).',
    // Higher row & lower col = bigger
    calc: (el) => { const r = el.row / 4; const c = 1 - (el.col > 2 ? (el.col - 2) / 16 : el.col / 18); return (r * 0.6 + c * 0.4); }
  },
  reactivity_metal: {
    label: 'Reactivity (Metals)', lowLabel: 'Less reactive', highLabel: 'More reactive',
    gradientL: '#f9e79f', gradientR: '#e74c3c',
    hArrow: '', hArrowReverse: false,
    vArrow: 'Increases \u2193 (metals)',
    info: '<strong>Metal reactivity</strong> increases <strong>down a group</strong>. Outer electrons are further from nucleus and easier to lose. Group 1 metals show this clearly: Li < Na < K.',
    calc: (el) => { if (el.col > 2 && el.col < 13) return el.row / 4 * 0.5; if (el.col <= 2) return el.row / 4; return 0.1; }
  },
  reactivity_nonmetal: {
    label: 'Reactivity (Non-metals)', lowLabel: 'Less reactive', highLabel: 'More reactive',
    gradientL: '#f9e79f', gradientR: '#27ae60',
    hArrow: '', hArrowReverse: false,
    vArrow: 'Decreases \u2193 (non-metals)',
    info: '<strong>Non-metal reactivity</strong> increases <strong>up a group</strong>. Atoms are smaller so they attract electrons more strongly. Group 7: I < Br < Cl < F.',
    calc: (el) => { if (el.col >= 15 && el.col <= 17) return 1 - el.row / 5; if (el.col === 18) return 0; return 0.1; }
  },
  electronegativity: {
    label: 'Electronegativity', lowLabel: 'Low', highLabel: 'High',
    gradientL: '#f9e79f', gradientR: '#8e44ad',
    hArrow: 'Increases \u2192', hArrowReverse: false,
    vArrow: 'Decreases \u2193',
    info: '<strong>Electronegativity</strong> increases <strong>across a period</strong> (stronger nuclear charge) and <strong>decreases down a group</strong> (electrons further from nucleus). Fluorine is the most electronegative element.',
    calc: (el) => {
      if (el.col === 18) return 0;
      const c = el.col > 2 ? (el.col - 2) / 16 : el.col / 18;
      const r = 1 - el.row / 5;
      return c * 0.5 + r * 0.5;
    }
  },
  melting_point: {
    label: 'Melting Point', lowLabel: 'Low', highLabel: 'High',
    gradientL: '#3498db', gradientR: '#e74c3c',
    hArrow: 'Peaks in middle \u2192', hArrowReverse: false,
    vArrow: '',
    info: '<strong>Melting point</strong> generally increases across a period to a peak (Group 14 - carbon/silicon) then decreases sharply for non-metals. Metals in the middle have strong metallic bonding. Noble gases have very low melting points.',
    calc: (el) => {
      // Simplified: peak around col 6-8 or 14 for main group
      if (el.col === 18) return 0.05;
      if (el.col >= 15 && el.col <= 17) return 0.15 + Math.random() * 0.1;
      if (el.col === 14) return 0.85;
      if (el.col >= 3 && el.col <= 12) return 0.5 + (1 - Math.abs(el.col - 7.5) / 5) * 0.3;
      if (el.col <= 2) return 0.3 + el.col * 0.1;
      return 0.4;
    }
  }
};

function lerp(a, b, t) { return a + (b - a) * t; }
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return [r, g, b];
}
function rgbToHex(r, g, b) { return '#' + [r,g,b].map(x => Math.round(x).toString(16).padStart(2,'0')).join(''); }
function colorLerp(c1, c2, t) {
  const [r1,g1,b1] = hexToRgb(c1), [r2,g2,b2] = hexToRgb(c2);
  return rgbToHex(lerp(r1,r2,t), lerp(g1,g2,t), lerp(b1,b2,t));
}

let currentTrend = null;

function buildGrid() {
  const grid = document.getElementById('ptGrid');
  grid.innerHTML = '';
  for (let r = 1; r <= 4; r++) {
    for (let c = 1; c <= 18; c++) {
      const el = elements.find(e => e.row === r && e.col === c);
      const cell = document.createElement('div');
      cell.className = 'el-cell' + (el ? '' : ' empty');
      if (el) {
        let bg = '#e8edf2';
        if (currentTrend) {
          const t = trendData[currentTrend];
          const val = Math.max(0, Math.min(1, t.calc(el)));
          bg = colorLerp(t.gradientL, t.gradientR, val);
        }
        cell.style.background = bg;
        cell.style.color = '#1a2747';
        cell.innerHTML = `<span class="num">${el.z}</span><span class="sym">${el.sym}</span>`;
      }
      grid.appendChild(cell);
    }
  }
}

function buildChips() {
  const cont = document.getElementById('trendChips');
  Object.entries(trendData).forEach(([key, t]) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = t.label;
    chip.addEventListener('click', () => {
      cont.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentTrend = key;
      buildGrid();
      updateOverlay();
    });
    cont.appendChild(chip);
  });
}

function updateOverlay() {
  if (!currentTrend) return;
  const t = trendData[currentTrend];
  document.getElementById('legendBar').style.background = `linear-gradient(to right, ${t.gradientL}, ${t.gradientR})`;
  document.getElementById('legendLow').textContent = t.lowLabel;
  document.getElementById('legendHigh').textContent = t.highLabel;
  document.getElementById('infoBox').innerHTML = t.info;

  const arrowH = document.getElementById('arrowH');
  if (t.hArrow) {
    arrowH.style.display = 'flex';
    document.getElementById('arrowHBar').style.background = `linear-gradient(to right, ${t.gradientL}, ${t.gradientR})`;
    document.getElementById('arrowHLeft').textContent = '';
    document.getElementById('arrowHRight').textContent = t.hArrow;
  } else {
    arrowH.style.display = 'none';
  }
}

buildChips();
buildGrid();
</script>
</body>
</html>
