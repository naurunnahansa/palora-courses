<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Profile Diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: #f0f2f5; color: #1a1f2e; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  h1, h2, h3, h4 { font-family: 'Oswald', sans-serif; }
  .container { max-width: 550px; width: 100%; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); border: 1px solid #e5dfe0; padding: 24px; margin-bottom: 18px; }
  h1 { font-size: 1.5rem; color: #637EA1; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 16px; }
  canvas { width: 100%; background: #fafbfc; border-radius: 12px; border: 1px solid #e5dfe0; display: block; }
  .btn { background: #637EA1; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #506a8a; }
  .btn.active { background: #3d5570; box-shadow: 0 0 0 2px #637EA1; }
  .chip { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; border: 1.5px solid #e5dfe0; background: #fff; cursor: pointer; transition: all 0.2s; margin: 3px; }
  .chip:hover, .chip.active { background: #637EA1; color: #fff; border-color: #637EA1; }
  .controls { margin-top: 14px; }
  .control-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .control-row label { font-size: 0.82rem; font-weight: 500; min-width: 110px; }
  input[type="range"] { flex: 1; accent-color: #637EA1; min-width: 120px; }
  .value-badge { font-size: 0.78rem; background: #F5E6E8; padding: 2px 10px; border-radius: 10px; font-weight: 600; min-width: 55px; text-align: center; }
  .toggle-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .info-box { background: #F5E6E8; border-radius: 10px; padding: 12px 16px; font-size: 0.82rem; line-height: 1.5; margin-top: 12px; }
  .info-box strong { color: #637EA1; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Energy Profile Diagram</h1>
    <p class="subtitle">Visualise activation energy and enthalpy changes</p>
    <canvas id="canvas" width="1000" height="700"></canvas>
    <div class="controls">
      <div class="toggle-row">
        <span class="chip active" data-type="exothermic" onclick="setType('exothermic')">Exothermic</span>
        <span class="chip" data-type="endothermic" onclick="setType('endothermic')">Endothermic</span>
      </div>
      <div class="control-row">
        <label>Activation Energy</label>
        <input type="range" id="eaSlider" min="20" max="80" value="50" oninput="draw()">
        <span class="value-badge" id="eaVal">50 kJ</span>
      </div>
      <div class="control-row">
        <label>|&Delta;H|</label>
        <input type="range" id="dhSlider" min="10" max="60" value="30" oninput="draw()">
        <span class="value-badge" id="dhVal">30 kJ</span>
      </div>
      <div class="toggle-row">
        <span class="chip" id="catChip" onclick="toggleCatalyst()">Show Catalyst</span>
      </div>
    </div>
    <div class="info-box" id="info">
      <strong>Exothermic:</strong> Products are at a lower energy than reactants. &Delta;H is negative &mdash; energy is released to the surroundings.
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let type = 'exothermic';
let showCatalyst = false;

function setType(t) {
  type = t;
  document.querySelectorAll('.chip[data-type]').forEach(c => c.classList.toggle('active', c.dataset.type === t));
  updateInfo();
  draw();
}
function toggleCatalyst() {
  showCatalyst = !showCatalyst;
  document.getElementById('catChip').classList.toggle('active', showCatalyst);
  draw();
}
function updateInfo() {
  const info = document.getElementById('info');
  if (type === 'exothermic') {
    info.innerHTML = '<strong>Exothermic:</strong> Products are at a lower energy than reactants. &Delta;H is negative &mdash; energy is released to the surroundings.';
  } else {
    info.innerHTML = '<strong>Endothermic:</strong> Products are at a higher energy than reactants. &Delta;H is positive &mdash; energy is absorbed from the surroundings.';
  }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  const ea = +document.getElementById('eaSlider').value;
  const dh = +document.getElementById('dhSlider').value;
  document.getElementById('eaVal').textContent = ea + ' kJ';
  document.getElementById('dhVal').textContent = dh + ' kJ';

  ctx.clearRect(0, 0, W, H);

  const pad = { l: 80, r: 60, t: 50, b: 60 };
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;

  // Energy scale: 0 to 100
  const toY = (e) => pad.t + plotH - (e / 100) * plotH;
  const toX = (frac) => pad.l + frac * plotW;

  // Energy levels
  let reactantE, productE, peakE;
  if (type === 'exothermic') {
    reactantE = 40 + dh / 2;
    productE = reactantE - dh;
    peakE = reactantE + ea;
  } else {
    reactantE = 40 - dh / 2;
    productE = reactantE + dh;
    peakE = productE + ea;
  }

  // Axes
  ctx.strokeStyle = '#1a1f2e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t);
  ctx.lineTo(pad.l, H - pad.b);
  ctx.lineTo(W - pad.r, H - pad.b);
  ctx.stroke();

  ctx.font = '600 24px Oswald';
  ctx.fillStyle = '#1a1f2e';
  ctx.save();
  ctx.translate(28, pad.t + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('Energy', 0, 0);
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillText('Reaction Progress', pad.l + plotW / 2, H - 15);

  // Draw reaction curve
  const drawCurve = (eaPeak, dash, color, lw) => {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.setLineDash(dash);
    ctx.beginPath();

    // Reactant flat
    ctx.moveTo(toX(0.05), toY(reactantE));
    ctx.lineTo(toX(0.2), toY(reactantE));

    // Curve up to peak then down to products using bezier
    const peakX = toX(0.5);
    const peakY = toY(eaPeak);
    ctx.bezierCurveTo(toX(0.3), toY(reactantE), toX(0.35), peakY, peakX, peakY);
    ctx.bezierCurveTo(toX(0.65), peakY, toX(0.7), toY(productE), toX(0.8), toY(productE));

    // Product flat
    ctx.lineTo(toX(0.95), toY(productE));
    ctx.stroke();
    ctx.restore();
  };

  drawCurve(peakE, [], '#637EA1', 4);

  if (showCatalyst) {
    const catEa = ea * 0.55;
    let catPeak;
    if (type === 'exothermic') {
      catPeak = reactantE + catEa;
    } else {
      catPeak = productE + catEa;
    }
    drawCurve(catPeak, [10, 8], '#c06080', 3);

    // Catalyst label
    ctx.font = '500 18px Outfit';
    ctx.fillStyle = '#c06080';
    ctx.textAlign = 'left';
    ctx.fillText('Catalysed pathway', toX(0.55), toY(catPeak) - 12);
  }

  // Reactant / Product labels
  ctx.font = '600 22px Oswald';
  ctx.fillStyle = '#1a1f2e';
  ctx.textAlign = 'center';
  ctx.fillText('Reactants', toX(0.12), toY(reactantE) - 16);
  ctx.fillText('Products', toX(0.88), toY(productE) - 16);

  // Ea arrow
  const arrowX = toX(0.22);
  drawArrow(arrowX, toY(reactantE), arrowX, toY(peakE), '#d45', 2.5);
  ctx.font = '600 20px Outfit';
  ctx.fillStyle = '#d45';
  ctx.textAlign = 'left';
  ctx.fillText('Ea = ' + ea + ' kJ', arrowX + 10, (toY(reactantE) + toY(peakE)) / 2 + 6);

  // DH arrow
  const dhX = toX(0.85);
  const dhTop = type === 'exothermic' ? productE : reactantE;
  const dhBot = type === 'exothermic' ? reactantE : productE;
  drawArrow(dhX, toY(dhBot), dhX, toY(dhTop), '#637EA1', 2.5);
  const sign = type === 'exothermic' ? '-' : '+';
  ctx.fillStyle = '#637EA1';
  ctx.textAlign = 'right';
  ctx.fillText('\u0394H = ' + sign + dh + ' kJ', dhX - 10, (toY(dhBot) + toY(dhTop)) / 2 + 6);

  // Dashed energy level lines
  ctx.save();
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.l, toY(reactantE));
  ctx.lineTo(W - pad.r, toY(reactantE));
  ctx.moveTo(pad.l, toY(productE));
  ctx.lineTo(W - pad.r, toY(productE));
  ctx.stroke();
  ctx.restore();
}

function drawArrow(x1, y1, x2, y2, color, lw) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const hs = 10;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs * Math.cos(angle - 0.4), y2 - hs * Math.sin(angle - 0.4));
  ctx.lineTo(x2 - hs * Math.cos(angle + 0.4), y2 - hs * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fill();
  // Arrow at start too (double-headed)
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + hs * Math.cos(angle - 0.4), y1 + hs * Math.sin(angle - 0.4));
  ctx.lineTo(x1 + hs * Math.cos(angle + 0.4), y1 + hs * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

draw();
</script>
</body>
</html>
