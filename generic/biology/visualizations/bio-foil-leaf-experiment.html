<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing Leaves for Starch: Foil Experiment</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fcfcfe;
    color: #1a2747;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    min-height: 100vh;
  }
  h1 { font-size: 1.5rem; color: #1835b4; margin-bottom: 8px; text-align: center; }
  .subtitle { font-size: 0.9rem; color: #6b7a99; margin-bottom: 20px; text-align: center; }
  .stage-container {
    width: 100%; max-width: 620px;
    background: #e8ecf8; border: 1.5px solid #d4d8e5; border-radius: 14px;
    padding: 24px; min-height: 340px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .stage-title { font-size: 1.1rem; font-weight: 700; color: #1835b4; margin-bottom: 6px; }
  .stage-desc { font-size: 0.88rem; text-align: center; margin-bottom: 18px; max-width: 500px; line-height: 1.5; }
  svg { max-width: 100%; height: auto; }
  .controls {
    margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    padding: 10px 24px; border: none; border-radius: 8px; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s, transform 0.15s;
    background: #1835b4; color: #fff;
  }
  .btn:hover { background: #2244cc; transform: scale(1.04); }
  .btn:disabled { background: #b0b8d0; cursor: default; transform: none; }
  .btn-outline { background: #fff; color: #1835b4; border: 2px solid #1835b4; }
  .btn-outline:hover { background: #e8ecf8; }
  .step-indicator {
    font-size: 0.82rem; color: #6b7a99; font-weight: 500;
  }
  .caution { color: #c0392b; font-weight: 600; font-size: 0.82rem; margin-top: 6px; }
</style>
</head>
<body>

<h1>Testing Leaves for Starch: Foil Experiment</h1>
<p class="subtitle">Step through the experiment to see how light affects starch production in leaves.</p>

<div class="stage-container" id="stage"></div>

<div class="controls">
  <button class="btn btn-outline" id="prevBtn" disabled onclick="prev()">Back</button>
  <span class="step-indicator" id="stepLabel">Step 1 of 6</span>
  <button class="btn" id="nextBtn" onclick="next()">Next Step</button>
</div>

<script>
const steps = [
  {
    title: 'Step 1: De-starch the Plant',
    desc: 'Place the plant in darkness for 48 hours so it uses up all stored starch in its leaves.',
    svg: `<svg viewBox="0 0 400 220" width="400">
      <rect x="140" y="140" width="120" height="60" rx="6" fill="#8B6914" stroke="#5a4510" stroke-width="2"/>
      <rect x="155" y="110" width="8" height="40" fill="#3a7d3a"/>
      <rect x="237" y="110" width="8" height="40" fill="#3a7d3a"/>
      <ellipse cx="160" cy="100" rx="30" ry="16" fill="#4a9e4a"/>
      <ellipse cx="240" cy="95" rx="28" ry="14" fill="#4a9e4a"/>
      <ellipse cx="200" cy="88" rx="32" ry="15" fill="#4a9e4a"/>
      <rect x="80" y="20" width="240" height="190" rx="10" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
      <text x="200" y="16" text-anchor="middle" font-size="12" fill="#6b7a99">Dark cupboard</text>
      <text x="200" y="215" text-anchor="middle" font-size="11" fill="#6b7a99">48 hours in darkness</text>
    </svg>`
  },
  {
    title: 'Step 2: Cover Part of a Leaf with Foil',
    desc: 'Wrap aluminium foil around part of one leaf, then place the plant in bright light for several hours.',
    svg: `<svg viewBox="0 0 400 240" width="400">
      <circle cx="200" cy="30" r="24" fill="#FFD93D" stroke="#e6b800" stroke-width="2"/>
      <line x1="200" y1="58" x2="200" y2="80" stroke="#FFD93D" stroke-width="2"/>
      <line x1="170" y1="50" x2="155" y2="65" stroke="#FFD93D" stroke-width="2"/>
      <line x1="230" y1="50" x2="245" y2="65" stroke="#FFD93D" stroke-width="2"/>
      <text x="200" y="34" text-anchor="middle" font-size="11" fill="#8B6914">Light</text>
      <rect x="150" y="160" width="100" height="50" rx="6" fill="#8B6914" stroke="#5a4510" stroke-width="2"/>
      <rect x="195" y="120" width="8" height="45" fill="#3a7d3a"/>
      <ellipse cx="200" cy="108" rx="55" ry="22" fill="#4a9e4a"/>
      <rect x="172" y="96" width="30" height="24" rx="3" fill="#aaa" stroke="#888" stroke-width="1.5" opacity="0.85"/>
      <text x="187" y="112" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">Foil</text>
      <text x="248" y="112" font-size="10" fill="#4a9e4a">Exposed</text>
      <text x="200" y="230" text-anchor="middle" font-size="11" fill="#6b7a99">Leave in bright light for 6+ hours</text>
    </svg>`
  },
  {
    title: 'Step 3: Remove the Leaf and Boil in Water',
    desc: 'Detach the leaf, remove the foil, and boil it in water for 1-2 minutes to kill the cells and stop reactions.',
    svg: `<svg viewBox="0 0 400 220" width="400">
      <rect x="140" y="100" width="120" height="80" rx="6" fill="#ddd" stroke="#999" stroke-width="2"/>
      <ellipse cx="200" cy="100" rx="60" ry="14" fill="#ccc" stroke="#999" stroke-width="2"/>
      <ellipse cx="200" cy="120" rx="40" ry="8" fill="#8ec4f0" opacity="0.7"/>
      <ellipse cx="200" cy="115" rx="30" ry="12" fill="#6ab86a" opacity="0.8"/>
      <text x="200" y="119" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Leaf</text>
      <path d="M175 95 Q178 85 185 88" stroke="#8ec4f0" stroke-width="1.5" fill="none"/>
      <path d="M200 90 Q203 78 208 82" stroke="#8ec4f0" stroke-width="1.5" fill="none"/>
      <path d="M220 93 Q224 83 228 87" stroke="#8ec4f0" stroke-width="1.5" fill="none"/>
      <rect x="155" y="185" width="90" height="12" rx="3" fill="#e74c3c" opacity="0.7"/>
      <text x="200" y="194" text-anchor="middle" font-size="9" fill="#fff">Heat</text>
      <text x="200" y="215" text-anchor="middle" font-size="11" fill="#6b7a99">Boil in water to kill cells</text>
    </svg>`
  },
  {
    title: 'Step 4: Boil in Ethanol to Remove Chlorophyll',
    desc: 'Place the leaf in hot ethanol (using a water bath, NOT direct heat) to dissolve the green chlorophyll. The leaf turns white/pale.',
    svg: `<svg viewBox="0 0 400 240" width="400">
      <rect x="100" y="110" width="200" height="90" rx="6" fill="#ddd" stroke="#999" stroke-width="2"/>
      <ellipse cx="200" cy="110" rx="100" ry="16" fill="#ccc" stroke="#999" stroke-width="2"/>
      <ellipse cx="200" cy="140" rx="70" ry="10" fill="#8ec4f0" opacity="0.5"/>
      <text x="200" y="188" text-anchor="middle" font-size="10" fill="#6b7a99">Water bath</text>
      <rect x="165" y="105" width="70" height="55" rx="4" fill="rgba(255,255,255,0.8)" stroke="#999" stroke-width="1.5"/>
      <ellipse cx="200" cy="125" rx="22" ry="8" fill="#d4f5d4" opacity="0.9"/>
      <text x="200" y="129" text-anchor="middle" font-size="8" fill="#3a7d3a">Leaf</text>
      <ellipse cx="200" cy="118" rx="25" ry="5" fill="#c8e6c8" opacity="0.4"/>
      <text x="200" y="100" text-anchor="middle" font-size="10" fill="#1a2747" font-weight="600">Ethanol</text>
      <text x="200" y="218" text-anchor="middle" font-size="11" fill="#6b7a99">Chlorophyll dissolves; leaf turns white</text>
    </svg>`,
    caution: 'CAUTION: Ethanol is flammable. Always use a water bath, never direct heat.'
  },
  {
    title: 'Step 5: Add Iodine Solution',
    desc: 'Rinse the leaf in water to soften it, then spread it on a white tile. Add drops of iodine solution to test for starch.',
    svg: `<svg viewBox="0 0 400 220" width="400">
      <rect x="100" y="110" width="200" height="20" rx="4" fill="#eee" stroke="#ccc" stroke-width="1.5"/>
      <text x="200" y="148" text-anchor="middle" font-size="10" fill="#aaa">White tile</text>
      <ellipse cx="200" cy="108" rx="55" ry="20" fill="#f5f5e0" stroke="#ccc" stroke-width="1"/>
      <text x="200" y="112" text-anchor="middle" font-size="10" fill="#999">Pale leaf</text>
      <line x1="260" y1="50" x2="220" y2="95" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="218" cy="98" r="4" fill="#b8860b" opacity="0.7"/>
      <circle cx="226" cy="100" r="3" fill="#b8860b" opacity="0.5"/>
      <text x="275" y="48" font-size="11" fill="#b8860b" font-weight="600">Iodine</text>
      <text x="200" y="180" text-anchor="middle" font-size="11" fill="#6b7a99">Add iodine drops across the whole leaf</text>
    </svg>`
  },
  {
    title: 'Step 6: Observe the Results',
    desc: 'The part of the leaf that was exposed to light turns blue-black (starch present). The part covered by foil stays brown/yellow (no starch).',
    svg: `<svg viewBox="0 0 400 240" width="400">
      <rect x="100" y="100" width="200" height="20" rx="4" fill="#eee" stroke="#ccc" stroke-width="1.5"/>
      <ellipse cx="200" cy="98" rx="70" ry="28" fill="#f5f5e0" stroke="#ccc" stroke-width="1"/>
      <clipPath id="leafClip"><ellipse cx="200" cy="98" rx="70" ry="28"/></clipPath>
      <g clip-path="url(#leafClip)">
        <rect x="130" y="70" width="70" height="60" fill="#1a1a5e"/>
        <rect x="200" y="70" width="70" height="60" fill="#c8a832"/>
      </g>
      <ellipse cx="200" cy="98" rx="70" ry="28" fill="none" stroke="#999" stroke-width="1.5"/>
      <line x1="200" y1="68" x2="200" y2="128" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="165" y="100" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Blue-black</text>
      <text x="235" y="100" text-anchor="middle" font-size="11" fill="#1a2747" font-weight="700">Brown</text>
      <line x1="165" y1="130" x2="165" y2="150" stroke="#1835b4" stroke-width="1.5"/>
      <text x="165" y="165" text-anchor="middle" font-size="10" fill="#1835b4" font-weight="600">Exposed to light</text>
      <text x="165" y="178" text-anchor="middle" font-size="9" fill="#6b7a99">Starch PRESENT</text>
      <line x1="235" y1="130" x2="235" y2="150" stroke="#b8860b" stroke-width="1.5"/>
      <text x="235" y="165" text-anchor="middle" font-size="10" fill="#b8860b" font-weight="600">Covered by foil</text>
      <text x="235" y="178" text-anchor="middle" font-size="9" fill="#6b7a99">NO starch</text>
      <text x="200" y="210" text-anchor="middle" font-size="11" fill="#1a2747" font-weight="600">Conclusion: Light is needed for photosynthesis</text>
    </svg>`
  }
];

let currentStep = 0;
const stageEl = document.getElementById('stage');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const stepLabel = document.getElementById('stepLabel');

function render() {
  const s = steps[currentStep];
  stageEl.innerHTML = `
    <div class="stage-title">${s.title}</div>
    <div class="stage-desc">${s.desc}</div>
    ${s.svg}
    ${s.caution ? '<div class="caution">' + s.caution + '</div>' : ''}`;
  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = currentStep === steps.length - 1;
  stepLabel.textContent = `Step ${currentStep + 1} of ${steps.length}`;
}

function next() { if (currentStep < steps.length - 1) { currentStep++; render(); } }
function prev() { if (currentStep > 0) { currentStep--; render(); } }

render();
</script>

</body>
</html>
