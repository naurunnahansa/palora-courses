<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrient Absorption After Digestion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fcfcfe;
    color: #1a2747;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    min-height: 100vh;
  }
  h1 { font-size: 1.5rem; color: #1835b4; margin-bottom: 6px; text-align: center; }
  .subtitle { font-size: 0.9rem; color: #6b7a99; margin-bottom: 20px; text-align: center; max-width: 560px; }
  .diagram { width: 100%; max-width: 700px; }
  svg { width: 100%; height: auto; }
  .lbl {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 10.5px;
    fill: #1a2747;
  }
  .lbl-bold {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 12px;
    font-weight: 700;
    fill: #1835b4;
  }
  .lbl-sm {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 9px;
    fill: #6b7a99;
  }
  .tooltip-g { cursor: pointer; }
  .tt-box {
    position: absolute;
    background: #e8ecf8;
    border: 1.5px solid #d4d8e5;
    border-radius: 8px;
    padding: 10px 14px;
    max-width: 240px;
    font-size: 0.8rem;
    line-height: 1.45;
    box-shadow: 0 3px 12px rgba(24,53,180,0.12);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .tt-box.visible { opacity: 1; }
  .tt-box strong { color: #1835b4; }
  .container { position: relative; width: 100%; max-width: 700px; }
</style>
</head>
<body>
<h1>Nutrient Absorption After Digestion</h1>
<p class="subtitle">Different nutrients take different routes from the small intestine to reach body cells. Hover over nutrients for details.</p>
<div class="container" id="container">
  <div class="diagram">
    <svg viewBox="0 0 700 500" id="svg">
      <defs>
        <marker id="arrRed" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
          <polygon points="0,0 7,2.5 0,5" fill="#c0392b"/>
        </marker>
        <marker id="arrPurp" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
          <polygon points="0,0 7,2.5 0,5" fill="#8e44ad"/>
        </marker>
        <marker id="arrTeal" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
          <polygon points="0,0 7,2.5 0,5" fill="#16a085"/>
        </marker>
      </defs>

      <!-- VILLUS (left side) -->
      <path d="M 30,80 Q 30,40 80,30 Q 130,20 140,50 L 145,400 Q 145,430 80,430 Q 20,430 25,400 Z"
        fill="#fce4ec" stroke="#e57373" stroke-width="2" rx="10"/>
      <!-- Epithelial cells pattern -->
      <rect x="36" y="60" width="100" height="340" rx="4" fill="none" stroke="#e57373" stroke-width="0.8" stroke-dasharray="3,6"/>
      <!-- Blood capillary -->
      <line x1="60" y1="70" x2="60" y2="400" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3"/>
      <text x="50" y="65" class="lbl-sm" fill="#c0392b">Blood capillary</text>
      <!-- Lacteal -->
      <line x1="110" y1="70" x2="110" y2="400" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="6,3"/>
      <text x="100" y="65" class="lbl-sm" fill="#8e44ad">Lacteal</text>

      <text x="80" y="450" text-anchor="middle" class="lbl-bold" fill="#e57373">VILLUS</text>
      <text x="80" y="465" text-anchor="middle" class="lbl-sm">(small intestine)</text>

      <!-- Microvilli label -->
      <text x="80" y="22" text-anchor="middle" class="lbl-sm" fill="#e57373">Microvilli (increase SA)</text>

      <!-- PATHWAY 1: Amino acids + Glucose -->
      <g class="tooltip-g" data-tip="amino">
        <rect x="160" y="90" width="130" height="50" rx="8" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/>
        <text x="225" y="112" text-anchor="middle" class="lbl" fill="#c0392b" font-weight="600">Amino Acids</text>
        <text x="225" y="128" text-anchor="middle" class="lbl" fill="#c0392b" font-weight="600">+ Glucose</text>
      </g>
      <!-- Arrow to hepatic portal vein -->
      <path d="M 290,115 L 340,115" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrRed)"/>
      <!-- Hepatic portal vein -->
      <rect x="348" y="90" width="110" height="50" rx="8" fill="#ffcdd2" stroke="#c0392b" stroke-width="1.5"/>
      <text x="403" y="112" text-anchor="middle" class="lbl" fill="#c0392b" font-weight="600">Hepatic Portal</text>
      <text x="403" y="128" text-anchor="middle" class="lbl" fill="#c0392b" font-weight="600">Vein</text>
      <!-- Arrow to liver -->
      <path d="M 458,115 L 510,115" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrRed)"/>
      <!-- Liver -->
      <rect x="518" y="80" width="90" height="70" rx="12" fill="#b71c1c" opacity="0.15" stroke="#c0392b" stroke-width="2"/>
      <text x="563" y="112" text-anchor="middle" class="lbl-bold" fill="#c0392b">LIVER</text>
      <text x="563" y="128" text-anchor="middle" class="lbl-sm" fill="#c0392b">Processing</text>
      <!-- Arrow to body cells -->
      <path d="M 608,115 L 650,115" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrRed)"/>
      <text x="670" y="110" class="lbl" fill="#c0392b" font-weight="600">Body</text>
      <text x="670" y="124" class="lbl" fill="#c0392b" font-weight="600">Cells</text>
      <!-- Connection from capillary -->
      <path d="M 60,130 Q 100,130 140,120 L 158,115" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- PATHWAY 2: Fatty acids + Glycerol -->
      <g class="tooltip-g" data-tip="fats">
        <rect x="160" y="220" width="130" height="50" rx="8" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.5"/>
        <text x="225" y="242" text-anchor="middle" class="lbl" fill="#8e44ad" font-weight="600">Fatty Acids</text>
        <text x="225" y="258" text-anchor="middle" class="lbl" fill="#8e44ad" font-weight="600">+ Glycerol</text>
      </g>
      <!-- Recombine note -->
      <text x="225" y="290" text-anchor="middle" class="lbl-sm" fill="#8e44ad">Recombine into fats</text>
      <text x="225" y="302" text-anchor="middle" class="lbl-sm" fill="#8e44ad">in epithelial cells</text>
      <!-- Arrow to lacteal/lymph -->
      <path d="M 290,245 L 348,245" fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrPurp)"/>
      <!-- Lymphatic system -->
      <rect x="348" y="220" width="110" height="50" rx="8" fill="#e1bee7" stroke="#8e44ad" stroke-width="1.5"/>
      <text x="403" y="242" text-anchor="middle" class="lbl" fill="#8e44ad" font-weight="600">Lacteal</text>
      <text x="403" y="258" text-anchor="middle" class="lbl" fill="#8e44ad" font-weight="600">(Lymphatic)</text>
      <!-- Arrow to blood -->
      <path d="M 458,245 L 510,245" fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrPurp)"/>
      <rect x="518" y="220" width="90" height="50" rx="10" fill="#8e44ad" opacity="0.12" stroke="#8e44ad" stroke-width="1.5"/>
      <text x="563" y="242" text-anchor="middle" class="lbl" fill="#8e44ad" font-weight="600">Lymph</text>
      <text x="563" y="258" text-anchor="middle" class="lbl" fill="#8e44ad" font-weight="600">System</text>
      <!-- Arrow eventually to blood -->
      <path d="M 608,245 Q 640,245 650,200 Q 660,160 650,130" fill="none" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrPurp)" stroke-dasharray="4,3"/>
      <text x="640" y="180" class="lbl-sm" fill="#8e44ad">Eventually</text>
      <text x="640" y="192" class="lbl-sm" fill="#8e44ad">enters blood</text>
      <!-- Connection from lacteal -->
      <path d="M 110,240 Q 140,240 155,242" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- PATHWAY 3: Vitamins & Minerals -->
      <g class="tooltip-g" data-tip="vitamins">
        <rect x="160" y="360" width="130" height="50" rx="8" fill="#e0f2f1" stroke="#16a085" stroke-width="1.5"/>
        <text x="225" y="382" text-anchor="middle" class="lbl" fill="#16a085" font-weight="600">Vitamins &amp;</text>
        <text x="225" y="398" text-anchor="middle" class="lbl" fill="#16a085" font-weight="600">Minerals</text>
      </g>
      <!-- Arrow to general circulation -->
      <path d="M 290,385 L 348,385" fill="none" stroke="#16a085" stroke-width="2" marker-end="url(#arrTeal)"/>
      <rect x="348" y="360" width="110" height="50" rx="8" fill="#b2dfdb" stroke="#16a085" stroke-width="1.5"/>
      <text x="403" y="378" text-anchor="middle" class="lbl" fill="#16a085" font-weight="600">Blood</text>
      <text x="403" y="394" text-anchor="middle" class="lbl" fill="#16a085" font-weight="600">Capillary</text>
      <path d="M 458,385 L 510,385" fill="none" stroke="#16a085" stroke-width="2" marker-end="url(#arrTeal)"/>
      <rect x="518" y="360" width="90" height="50" rx="10" fill="#16a085" opacity="0.12" stroke="#16a085" stroke-width="1.5"/>
      <text x="563" y="382" text-anchor="middle" class="lbl" fill="#16a085" font-weight="600">General</text>
      <text x="563" y="398" text-anchor="middle" class="lbl" fill="#16a085" font-weight="600">Circulation</text>
      <!-- Connection from capillary -->
      <path d="M 60,370 Q 120,375 155,382" fill="none" stroke="#16a085" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Key -->
      <rect x="160" y="470" width="12" height="12" rx="3" fill="#c0392b"/>
      <text x="178" y="481" class="lbl" fill="#1a2747">Amino acids &amp; Glucose (via blood)</text>
      <rect x="370" y="470" width="12" height="12" rx="3" fill="#8e44ad"/>
      <text x="388" y="481" class="lbl" fill="#1a2747">Fats (via lymph)</text>
      <rect x="500" y="470" width="12" height="12" rx="3" fill="#16a085"/>
      <text x="518" y="481" class="lbl" fill="#1a2747">Vitamins &amp; Minerals</text>
    </svg>
  </div>
  <div class="tt-box" id="tooltip"></div>
</div>

<script>
const tips = {
  amino: "<strong>Amino Acids &amp; Glucose</strong><br>Absorbed into blood capillaries of the villus by <strong>active transport</strong> (amino acids) and <strong>active transport / facilitated diffusion</strong> (glucose). Carried via the hepatic portal vein to the liver for processing before entering general circulation.",
  fats: "<strong>Fatty Acids &amp; Glycerol</strong><br>Absorbed by <strong>diffusion</strong> into epithelial cells. Recombined into triglycerides (fats), then packaged into chylomicrons and absorbed into the <strong>lacteal</strong> (lymphatic capillary). Eventually drain into the bloodstream via the thoracic duct.",
  vitamins: "<strong>Vitamins &amp; Minerals</strong><br>Most are absorbed by <strong>diffusion</strong> or <strong>active transport</strong> into blood capillaries. Water-soluble vitamins (B, C) enter blood directly. Fat-soluble vitamins (A, D, E, K) follow the fat pathway via lacteals."
};

const tooltip = document.getElementById("tooltip");
const container = document.getElementById("container");

document.querySelectorAll(".tooltip-g").forEach(g => {
  g.addEventListener("mouseenter", (e) => {
    const key = g.getAttribute("data-tip");
    tooltip.innerHTML = tips[key];
    tooltip.classList.add("visible");
    const rect = container.getBoundingClientRect();
    const gRect = g.getBoundingClientRect();
    tooltip.style.left = (gRect.left - rect.left + gRect.width + 8) + "px";
    tooltip.style.top = (gRect.top - rect.top - 10) + "px";
  });
  g.addEventListener("mouseleave", () => {
    tooltip.classList.remove("visible");
  });
});
</script>
</body>
</html>
