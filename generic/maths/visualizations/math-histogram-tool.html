<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histogram Builder</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#fcfcfe;padding:10px 12px;color:#1a2747}.container{max-width:100%;margin:0 auto}h1{font-size:1.0rem;color:#1835b4;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.card{border-radius:5px;border:1px solid #d4d8e5;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;background:#fff}.card-title{font-size:.85rem;color:#1835b4;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc}.toggle-row{display:flex;gap:8px;margin-bottom:10px}.toggle-btn{flex:1;padding:6px;border:1px solid #d4d8e5;border-radius:5px;background:#e8ecf8;font-size:.78rem;cursor:pointer;text-align:center;color:#1a2747;font-family:system-ui}.toggle-btn.active{background:#1835b4;color:#fff;border-color:#1835b4}table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px}th{background:#e8ecf8;color:#1835b4;padding:6px 8px;text-align:center;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}td{padding:5px 8px;text-align:center;border-bottom:1px solid #e8ecf8}td input{width:100%;padding:3px;border:1px solid #d4d8e5;border-radius:3px;text-align:center;font-size:.78rem;font-family:system-ui}tr:hover{background:#fafbfc}.tooltip{position:fixed;background:#1a2747;color:#fff;padding:6px 10px;border-radius:4px;font-size:.75rem;pointer-events:none;display:none;z-index:10;line-height:1.5}.result-box{background:#e8ecf8;border-radius:5px;padding:8px 12px;text-align:center;font-size:.82rem;color:#1835b4;margin-top:8px;font-weight:600}.info{background:#fafbfc;border-radius:5px;padding:8px;font-size:.75rem;color:#4a5568;text-align:center;margin-top:8px}.info strong{color:#1835b4}</style>
</head>
<body>
<div class="container">
    <h1>Histogram Builder</h1>
    <div class="card">
        <div class="card-title">Dataset</div>
        <div class="toggle-row">
            <button class="toggle-btn active" id="btnEqual">Equal Class Widths</button>
            <button class="toggle-btn" id="btnUnequal">Unequal Class Widths</button>
        </div>
        <table>
            <thead><tr><th>Class Interval</th><th>Frequency</th><th>Class Width</th><th>Freq. Density</th></tr></thead>
            <tbody id="dataBody"></tbody>
        </table>
        <div class="result-box" id="totalFreq"></div>
    </div>
    <div class="card" style="padding:8px"><canvas id="cv" width="900" height="600"></canvas></div>
    <div class="info">In a histogram, the <strong>area</strong> of each bar represents the frequency. Bar height = <strong>frequency density</strong> = frequency / class width. This is essential when class widths are unequal.</div>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const tooltip=document.getElementById('tooltip');

const equalData=[
    {lower:0,upper:10,freq:5},
    {lower:10,upper:20,freq:12},
    {lower:20,upper:30,freq:18},
    {lower:30,upper:40,freq:25},
    {lower:40,upper:50,freq:20},
    {lower:50,upper:60,freq:14},
    {lower:60,upper:70,freq:8},
    {lower:70,upper:80,freq:3}
];

const unequalData=[
    {lower:0,upper:5,freq:4},
    {lower:5,upper:10,freq:9},
    {lower:10,upper:20,freq:16},
    {lower:20,upper:30,freq:22},
    {lower:30,upper:50,freq:30},
    {lower:50,upper:80,freq:18},
    {lower:80,upper:100,freq:6}
];

let currentData=equalData;
let hoverIdx=-1;

function resize(){const w=Math.min(600,cv.parentElement.clientWidth-16);cv.style.width=w+'px';cv.style.height=(w*0.667)+'px'}
resize();window.addEventListener('resize',resize);

document.getElementById('btnEqual').addEventListener('click',function(){currentData=equalData;this.classList.add('active');document.getElementById('btnUnequal').classList.remove('active');buildTable();draw()});
document.getElementById('btnUnequal').addEventListener('click',function(){currentData=unequalData;this.classList.add('active');document.getElementById('btnEqual').classList.remove('active');buildTable();draw()});

function buildTable(){
    const body=document.getElementById('dataBody');
    let html='',totalFreq=0;
    for(let i=0;i<currentData.length;i++){
        const d=currentData[i];
        const w=d.upper-d.lower;
        const fd=(d.freq/w).toFixed(2);
        totalFreq+=d.freq;
        html+='<tr><td>'+d.lower+' - '+d.upper+'</td><td>'+d.freq+'</td><td>'+w+'</td><td>'+fd+'</td></tr>';
    }
    body.innerHTML=html;
    document.getElementById('totalFreq').textContent='Total Frequency: '+totalFreq;
}

function draw(){
    const W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);

    const margin={top:30,right:30,bottom:50,left:70};
    const plotW=W-margin.left-margin.right;
    const plotH=H-margin.top-margin.bottom;

    // Find scales
    const minX=currentData[0].lower;
    const maxX=currentData[currentData.length-1].upper;
    let maxFD=0;
    for(const d of currentData){
        const fd=d.freq/(d.upper-d.lower);
        if(fd>maxFD)maxFD=fd;
    }
    maxFD=Math.ceil(maxFD*1.2*10)/10;

    const scaleX=plotW/(maxX-minX);
    const scaleY=plotH/maxFD;

    // Axes
    ctx.strokeStyle='#1a2747';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(margin.left,margin.top);ctx.lineTo(margin.left,H-margin.bottom);ctx.lineTo(W-margin.right,H-margin.bottom);ctx.stroke();

    // Y-axis ticks and labels
    ctx.fillStyle='#4a5568';ctx.font='11px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
    const yStep=maxFD>3?0.5:0.2;
    for(let v=0;v<=maxFD;v+=yStep){
        const y=H-margin.bottom-v*scaleY;
        ctx.strokeStyle='#e8ecf8';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(margin.left,y);ctx.lineTo(W-margin.right,y);ctx.stroke();
        ctx.fillStyle='#4a5568';ctx.fillText(v.toFixed(1),margin.left-8,y);
    }

    // X-axis ticks
    ctx.textAlign='center';ctx.textBaseline='top';
    const xStep=maxX<=50?5:maxX<=100?10:20;
    for(let v=minX;v<=maxX;v+=xStep){
        const x=margin.left+(v-minX)*scaleX;
        ctx.strokeStyle='#d4d8e5';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x,H-margin.bottom);ctx.lineTo(x,H-margin.bottom+5);ctx.stroke();
        ctx.fillStyle='#4a5568';ctx.fillText(v,x,H-margin.bottom+8);
    }

    // Axis labels
    ctx.fillStyle='#1835b4';ctx.font='bold 12px system-ui';ctx.textAlign='center';
    ctx.fillText('Value',W/2,H-8);
    ctx.save();ctx.translate(16,H/2);ctx.rotate(-Math.PI/2);ctx.fillText('Frequency Density',0,0);ctx.restore();

    // Bars
    const barRects=[];
    for(let i=0;i<currentData.length;i++){
        const d=currentData[i];
        const cw=d.upper-d.lower;
        const fd=d.freq/cw;
        const x=margin.left+(d.lower-minX)*scaleX;
        const w=cw*scaleX;
        const barH=fd*scaleY;
        const y=H-margin.bottom-barH;

        barRects.push({x,y,w,h:barH,data:d,fd,cw});

        ctx.fillStyle=hoverIdx===i?'#1835b460':'#1835b430';
        ctx.fillRect(x,y,w,barH);
        ctx.strokeStyle=hoverIdx===i?'#1835b4':'#1835b4';ctx.lineWidth=hoverIdx===i?2.5:1.5;
        ctx.strokeRect(x,y,w,barH);
    }

    return barRects;
}

let barRects=[];
buildTable();
barRects=draw();

cv.addEventListener('mousemove',function(e){
    const rect=cv.getBoundingClientRect();
    const sx=cv.width/rect.width,sy=cv.height/rect.height;
    const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
    let found=-1;
    for(let i=0;i<barRects.length;i++){
        const b=barRects[i];
        if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){found=i;break}
    }
    hoverIdx=found;
    barRects=draw();
    if(found>=0){
        const b=barRects[found];
        tooltip.style.display='block';
        tooltip.style.left=(e.clientX+12)+'px';
        tooltip.style.top=(e.clientY-50)+'px';
        tooltip.innerHTML='Class: '+b.data.lower+' - '+b.data.upper+'<br>Frequency: '+b.data.freq+'<br>Class width: '+b.cw+'<br>Freq. density: '+b.fd.toFixed(2);
    } else {
        tooltip.style.display='none';
    }
});
cv.addEventListener('mouseleave',function(){hoverIdx=-1;barRects=draw();tooltip.style.display='none'});
</script>
</body>
</html>
