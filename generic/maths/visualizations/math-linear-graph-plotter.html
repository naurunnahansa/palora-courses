<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Graph Plotter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',system-ui,sans-serif;background:#FFF;padding:10px 12px;color:#1a1f2e}.container{max-width:550px;margin:0 auto}h1{font-family:'Oswald',sans-serif;font-size:1.0rem;color:#637EA1;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.card{border-radius:5px;border:1px solid #e5dfe0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;background:#fff}.card-title{font-family:'Oswald',sans-serif;font-size:.85rem;color:#637EA1;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc}.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#F5E6E8;border-radius:5px;padding:8px}.slider-row label{font-size:.78rem;font-weight:600;min-width:80px}.slider-row input[type=range]{flex:1;accent-color:#637EA1}.slider-row .val{font-family:'Oswald',sans-serif;font-size:.85rem;color:#637EA1;min-width:36px;text-align:center}.result-box{background:#F5E6E8;border-radius:5px;padding:8px 12px;text-align:center;font-family:'Oswald',sans-serif;font-size:.95rem;color:#637EA1;margin-top:8px}.info{background:#fafbfc;border-radius:5px;padding:8px;font-size:.75rem;color:#4a5568;text-align:center;margin-top:8px}.info strong{color:#637EA1}</style>
</head>
<body>
<div class="container">
    <h1>Linear Graph Plotter</h1>
    <div class="card">
        <div class="card-title">Controls</div>
        <div class="slider-row">
            <label>Gradient (m)</label>
            <input type="range" id="mSlider" min="-5" max="5" step="0.5" value="1">
            <span class="val" id="mVal">1</span>
        </div>
        <div class="slider-row">
            <label>Y-intercept (c)</label>
            <input type="range" id="cSlider" min="-5" max="5" step="0.5" value="0">
            <span class="val" id="cVal">0</span>
        </div>
    </div>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="1060"></canvas></div>
    <div class="result-box" id="eqDisplay">y = x</div>
    <div class="info">Adjust the <strong>gradient (m)</strong> and <strong>y-intercept (c)</strong> to explore the equation y = mx + c. The gradient controls steepness; the y-intercept is where the line crosses the y-axis.</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const mSlider=document.getElementById('mSlider'),cSlider=document.getElementById('cSlider');
const mVal=document.getElementById('mVal'),cVal=document.getElementById('cVal');
const eqDisplay=document.getElementById('eqDisplay');

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=w+'px'}
resize();window.addEventListener('resize',resize);

function draw(){
    const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
    const m=parseFloat(mSlider.value),c=parseFloat(cSlider.value);
    const scale=W/12; // each unit = scale px, range -6 to 6

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);

    // Grid
    ctx.strokeStyle='#e5dfe0';ctx.lineWidth=1;
    for(let i=-6;i<=6;i++){
        const px=cx+i*scale,py=cy-i*scale;
        ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke();
    }

    // Axes
    ctx.strokeStyle='#1a1f2e';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();

    // Axis labels
    ctx.fillStyle='#4a5568';ctx.font='500 22px Oswald';ctx.textAlign='center';ctx.textBaseline='top';
    for(let i=-5;i<=5;i++){
        if(i===0) continue;
        ctx.fillText(i,cx+i*scale,cy+6);
        ctx.textAlign='right';ctx.textBaseline='middle';
        ctx.fillText(i,cx-8,cy-i*scale);
        ctx.textAlign='center';ctx.textBaseline='top';
    }
    ctx.font='600 26px Oswald';ctx.fillStyle='#1a1f2e';
    ctx.textAlign='left';ctx.fillText('x',W-30,cy+8);
    ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('y',cx+14,24);

    // Line y=mx+c
    const x1=-7,x2=7;
    const y1=m*x1+c,y2=m*x2+c;
    ctx.strokeStyle='#637EA1';ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(cx+x1*scale,cy-y1*scale);
    ctx.lineTo(cx+x2*scale,cy-y2*scale);
    ctx.stroke();

    // Y-intercept point
    ctx.beginPath();ctx.arc(cx,cy-c*scale,8,0,Math.PI*2);
    ctx.fillStyle='#637EA1';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='600 14px Oswald';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('c',cx,cy-c*scale);

    // Label y-intercept
    ctx.fillStyle='#637EA1';ctx.font='500 22px Outfit';ctx.textAlign='left';
    ctx.fillText('(0, '+c+')',cx+14,cy-c*scale-14);

    // Rise/run triangle from (0,c) to (1, m+c) if m != 0
    if(m!==0){
        const rx0=cx,ry0=cy-c*scale;
        const rx1=cx+1*scale,ry1=cy-c*scale;
        const rx2=cx+1*scale,ry2=cy-(m+c)*scale;
        ctx.setLineDash([6,4]);ctx.strokeStyle='#dc3545';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(rx0,ry0);ctx.lineTo(rx1,ry1);ctx.lineTo(rx2,ry2);ctx.stroke();
        ctx.setLineDash([]);
        // Labels
        ctx.fillStyle='#dc3545';ctx.font='600 20px Outfit';
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText('run=1',rx0+(rx1-rx0)/2,ry0+6);
        ctx.textAlign='left';ctx.textBaseline='middle';
        ctx.fillText('rise='+m,rx1+6,ry1+(ry2-ry1)/2);
    }

    // Update displays
    mVal.textContent=m;
    cVal.textContent=c;
    let eq='y = ';
    if(m===0&&c===0) eq+='0';
    else if(m===0) eq+=c;
    else if(m===1) eq+='x';
    else if(m===-1) eq+='-x';
    else eq+=m+'x';
    if(m!==0&&c>0) eq+=' + '+c;
    else if(m!==0&&c<0) eq+=' - '+Math.abs(c);
    eqDisplay.textContent=eq;
}

mSlider.addEventListener('input',draw);
cSlider.addEventListener('input',draw);
draw();
</script>
</body>
</html>
