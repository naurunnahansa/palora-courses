<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Constructions</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family: system-ui, -apple-system, sans-serif;background: #fcfcfe;padding:10px 12px;color:#1a2747}.container{max-width: 100%;margin:0 auto}h1{font-family: system-ui, -apple-system, sans-serif;font-size:1.0rem;color:#1835b4;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.card{border-radius:5px;border:1px solid #d4d8e5;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;background:#fff}.card-title{font-family: system-ui, -apple-system, sans-serif;font-size:.85rem;color:#1835b4;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc}.controls{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.ctrl-btn{flex:1;min-width:100px;background:#e8ecf8;border:2px solid transparent;border-radius:5px;padding:6px;font-family: system-ui, -apple-system, sans-serif;font-size:.72rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}.ctrl-btn:hover{border-color:#1835b4}.ctrl-btn.active{background:#1835b4;color:#fff}.nav-controls{display:flex;gap:6px;margin-top:8px}.nav-btn{flex:1;background:#e8ecf8;border:2px solid transparent;border-radius:5px;padding:8px;font-family: system-ui, -apple-system, sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}.nav-btn:hover{border-color:#1835b4}.nav-btn:disabled{opacity:.4;cursor:default}.step-info{background:#e8ecf8;border-radius:5px;padding:8px 12px;text-align:center;font-family: system-ui, -apple-system, sans-serif;font-size:.85rem;color:#1835b4;margin-top:8px}.desc-box{background:#fafbfc;border-radius:5px;padding:8px;font-size:.78rem;color:#4a5568;text-align:center;margin-top:8px;line-height:1.5}.desc-box strong{color:#1835b4}</style>
</head>
<body>
<div class="container">
    <h1>Geometric Constructions</h1>
    <div class="card">
        <div class="card-title">Select Construction</div>
        <div class="controls" id="consBtns"></div>
    </div>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="800"></canvas></div>
    <div class="step-info" id="stepInfo">Step 1 of 4</div>
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevStep()">Previous Step</button>
        <button class="nav-btn" id="resetBtn" onclick="resetSteps()">Reset</button>
        <button class="nav-btn" id="nextBtn" onclick="nextStep()">Next Step</button>
    </div>
    <div class="desc-box" id="descBox"></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const constructions=[
    {name:'Perpendicular Bisector',steps:[
        {desc:'Draw line segment AB.',draw:drawPerpBisStep1},
        {desc:'Place compass at A. Draw arcs above and below the line (radius > half of AB).',draw:drawPerpBisStep2},
        {desc:'Without changing compass width, place at B. Draw arcs to intersect the first arcs.',draw:drawPerpBisStep3},
        {desc:'Draw a straight line through the two intersection points. This is the perpendicular bisector.',draw:drawPerpBisStep4}
    ]},
    {name:'Angle Bisector',steps:[
        {desc:'Draw an angle at point O with two rays.',draw:drawAngBisStep1},
        {desc:'Place compass at O. Draw an arc crossing both rays.',draw:drawAngBisStep2},
        {desc:'From each intersection point, draw arcs of equal radius that cross each other.',draw:drawAngBisStep3},
        {desc:'Draw a line from O through the intersection. This bisects the angle.',draw:drawAngBisStep4}
    ]},
    {name:'60 Degree Angle',steps:[
        {desc:'Draw a base line from point A.',draw:draw60Step1},
        {desc:'Place compass at A. Draw an arc crossing the base line at B.',draw:draw60Step2},
        {desc:'Without changing compass width, place at B. Draw an arc crossing the first arc at C.',draw:draw60Step3},
        {desc:'Draw a line from A through C. Angle BAC = 60 degrees.',draw:draw60Step4}
    ]}
];
let selCons=0,step=0;

const btnDiv=document.getElementById('consBtns');
constructions.forEach((c,i)=>{
    const b=document.createElement('button');b.className='ctrl-btn'+(i===0?' active':'');b.textContent=c.name;
    b.onclick=()=>{selCons=i;step=0;document.querySelectorAll('#consBtns .ctrl-btn').forEach((c2,j)=>c2.classList.toggle('active',j===i));draw()};
    btnDiv.appendChild(b);
});

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*800/1060)+'px'}
resize();window.addEventListener('resize',resize);

function nextStep(){const max=constructions[selCons].steps.length-1;if(step<max){step++;draw()}}
function prevStep(){if(step>0){step--;draw()}}
function resetSteps(){step=0;draw()}

function drawPoint(x,y,label,color){
    ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fillStyle=color||'#1835b4';ctx.fill();
    ctx.fillStyle='#1a2747';ctx.font='700 26px Oswald';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(label,x,y+12);
}
function drawArc(cx,cy,r,startA,endA,color){
    ctx.strokeStyle=color||'#dc3545';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,startA,endA);ctx.stroke();
}

// Perpendicular bisector steps
const pA={x:280,y:400},pB={x:780,y:400};
const pR=320;
function drawPerpBisBase(){
    ctx.strokeStyle='#1a2747';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pA.x,pA.y);ctx.lineTo(pB.x,pB.y);ctx.stroke();
    drawPoint(pA.x,pA.y,'A');drawPoint(pB.x,pB.y,'B');
}
function drawPerpBisStep1(){drawPerpBisBase()}
function drawPerpBisStep2(){drawPerpBisBase();drawArc(pA.x,pA.y,pR,-Math.PI*0.45,Math.PI*0.45,'#dc3545')}
function drawPerpBisStep3(){
    drawPerpBisBase();drawArc(pA.x,pA.y,pR,-Math.PI*0.45,Math.PI*0.45,'#dc3545');drawArc(pB.x,pB.y,pR,Math.PI*0.55,Math.PI*1.45,'#28a745');
    // Intersection points
    const mx=(pA.x+pB.x)/2,dx=pB.x-pA.x;
    const h=Math.sqrt(pR*pR-(dx/2)*(dx/2));
    drawPoint(mx,pA.y-h,'P','#e67e22');drawPoint(mx,pA.y+h,'Q','#e67e22');
}
function drawPerpBisStep4(){
    drawPerpBisStep3();
    const mx=(pA.x+pB.x)/2,dx=pB.x-pA.x;
    const h=Math.sqrt(pR*pR-(dx/2)*(dx/2));
    ctx.strokeStyle='#1835b4';ctx.lineWidth=3;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(mx,pA.y-h-60);ctx.lineTo(mx,pA.y+h+60);ctx.stroke();
    // Right angle marker
    const sz=20;
    ctx.strokeStyle='#1835b4';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(mx+sz,pA.y);ctx.lineTo(mx+sz,pA.y-sz);ctx.lineTo(mx,pA.y-sz);ctx.stroke();
    // Midpoint
    drawPoint(mx,pA.y,'M','#1835b4');
}

// Angle bisector steps
const oP={x:200,y:550},oAng=55*Math.PI/180;
const rayLen=500;
const oR1={x:oP.x+rayLen,y:oP.y};
const oR2={x:oP.x+Math.cos(-oAng)*rayLen,y:oP.y+Math.sin(-oAng)*rayLen};
function drawAngBisBase(){
    ctx.strokeStyle='#1a2747';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(oP.x,oP.y);ctx.lineTo(oR1.x,oR1.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(oP.x,oP.y);ctx.lineTo(oR2.x,oR2.y);ctx.stroke();
    drawPoint(oP.x,oP.y,'O');
}
function drawAngBisStep1(){drawAngBisBase()}
function drawAngBisStep2(){
    drawAngBisBase();
    const ar=200;
    drawArc(oP.x,oP.y,ar,-oAng,0,'#dc3545');
    drawPoint(oP.x+ar,oP.y,'','#dc3545');
    drawPoint(oP.x+Math.cos(-oAng)*ar,oP.y+Math.sin(-oAng)*ar,'','#dc3545');
}
function drawAngBisStep3(){
    drawAngBisStep2();
    const ar=200,ar2=160;
    const p1={x:oP.x+ar,y:oP.y},p2={x:oP.x+Math.cos(-oAng)*ar,y:oP.y+Math.sin(-oAng)*ar};
    drawArc(p1.x,p1.y,ar2,-Math.PI*0.6,-Math.PI*0.1,'#28a745');
    drawArc(p2.x,p2.y,ar2,-Math.PI*0.1,Math.PI*0.3,'#28a745');
}
function drawAngBisStep4(){
    drawAngBisStep3();
    const halfAng=oAng/2;
    ctx.strokeStyle='#1835b4';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(oP.x,oP.y);ctx.lineTo(oP.x+Math.cos(-halfAng)*rayLen,oP.y+Math.sin(-halfAng)*rayLen);ctx.stroke();
    // Angle marks
    drawArc(oP.x,oP.y,80,-halfAng,0,'#1835b4');
    drawArc(oP.x,oP.y,90,-oAng,-halfAng,'#1835b4');
    ctx.fillStyle='#1835b4';ctx.font='600 22px Oswald';ctx.textAlign='left';
    ctx.fillText(Math.round(oAng*90/Math.PI)+'\u00B0',oP.x+100,oP.y-20);
    ctx.fillText(Math.round(oAng*90/Math.PI)+'\u00B0',oP.x+100,oP.y-60);
}

// 60 degree angle steps
const sA={x:180,y:550},sBaseEnd={x:880,y:550};
const sR=400;
function draw60Base(){
    ctx.strokeStyle='#1a2747';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sA.x,sA.y);ctx.lineTo(sBaseEnd.x,sBaseEnd.y);ctx.stroke();
    drawPoint(sA.x,sA.y,'A');
}
function draw60Step1(){draw60Base()}
function draw60Step2(){
    draw60Base();
    drawArc(sA.x,sA.y,sR,-Math.PI*0.4,Math.PI*0.1,'#dc3545');
    drawPoint(sA.x+sR,sA.y,'B');
}
function draw60Step3(){
    draw60Step2();
    const bx=sA.x+sR,by=sA.y;
    drawArc(bx,by,sR,-Math.PI*0.75,-Math.PI*0.25,'#28a745');
    // Intersection: equilateral triangle point
    const cx2=sA.x+sR*Math.cos(-Math.PI/3),cy2=sA.y+sR*Math.sin(-Math.PI/3);
    drawPoint(cx2,cy2,'C','#e67e22');
}
function draw60Step4(){
    draw60Step3();
    const cx2=sA.x+sR*Math.cos(-Math.PI/3),cy2=sA.y+sR*Math.sin(-Math.PI/3);
    ctx.strokeStyle='#1835b4';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sA.x,sA.y);ctx.lineTo(cx2+(cx2-sA.x)*0.3,cy2+(cy2-sA.y)*0.3);ctx.stroke();
    // Angle arc
    drawArc(sA.x,sA.y,100,-Math.PI/3,0,'#1835b4');
    ctx.fillStyle='#1835b4';ctx.font='700 28px Oswald';ctx.textAlign='left';
    ctx.fillText('60\u00B0',sA.x+110,sA.y-40);
}

function draw(){
    const W=canvas.width,H=canvas.height;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);
    const cons=constructions[selCons];
    // Draw all steps up to current
    for(let i=0;i<=step;i++) cons.steps[i].draw();
    document.getElementById('stepInfo').textContent='Step '+(step+1)+' of '+cons.steps.length;
    document.getElementById('descBox').innerHTML='<strong>Step '+(step+1)+':</strong> '+cons.steps[step].desc;
    document.getElementById('prevBtn').disabled=step===0;
    document.getElementById('nextBtn').disabled=step===cons.steps.length-1;
}

draw();
</script>
</body>
</html>
