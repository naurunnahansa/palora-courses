<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Volume Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',system-ui,sans-serif;background:#FFF;padding:10px 12px;color:#1a1f2e}.container{max-width:550px;margin:0 auto}h1{font-family:'Oswald',sans-serif;font-size:1.0rem;color:#637EA1;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.card{border-radius:5px;border:1px solid #e5dfe0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;background:#fff}.card-title{font-family:'Oswald',sans-serif;font-size:.85rem;color:#637EA1;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc}.controls{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.ctrl-btn{flex:1;min-width:70px;background:#F5E6E8;border:2px solid transparent;border-radius:5px;padding:6px;font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}.ctrl-btn:hover{border-color:#637EA1}.ctrl-btn.active{background:#637EA1;color:#fff}.param-row{display:flex;align-items:center;gap:8px;background:#F5E6E8;border-radius:5px;padding:8px;margin-bottom:6px;flex-wrap:wrap;font-size:.78rem}.param-row label{font-weight:600;min-width:60px}.param-row input{width:70px;padding:6px 8px;border:1px solid #e5dfe0;border-radius:5px;font-family:'Outfit',sans-serif;font-size:.82rem;text-align:center}.result-box{background:#F5E6E8;border-radius:5px;padding:8px 12px;text-align:center;font-family:'Oswald',sans-serif;font-size:.95rem;color:#637EA1;margin-top:8px}.working{background:#fafbfc;border-radius:5px;padding:8px 12px;font-size:.78rem;color:#4a5568;margin-top:8px;line-height:1.8;text-align:center}.working strong{color:#637EA1}</style>
</head>
<body>
<div class="container">
    <h1>3D Volume Calculator</h1>
    <div class="card">
        <div class="card-title">Select Shape</div>
        <div class="controls" id="shapeBtns"></div>
    </div>
    <div class="card" id="inputCard">
        <div class="card-title">Dimensions</div>
        <div id="inputFields"></div>
    </div>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="800"></canvas></div>
    <div class="result-box" id="resultBox">Volume = 0</div>
    <div class="working" id="workingBox"></div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const shapes=[
    {name:'Cuboid',params:['Length','Width','Height'],defaults:[6,4,3]},
    {name:'Cylinder',params:['Radius','Height'],defaults:[4,7]},
    {name:'Cone',params:['Radius','Height'],defaults:[4,8]},
    {name:'Sphere',params:['Radius'],defaults:[5]},
    {name:'Prism',params:['Base','Tri Height','Length'],defaults:[5,4,8]}
];
let selShape=0;

const btnDiv=document.getElementById('shapeBtns');
shapes.forEach((s,i)=>{
    const b=document.createElement('button');b.className='ctrl-btn'+(i===0?' active':'');b.textContent=s.name;
    b.onclick=()=>{selShape=i;document.querySelectorAll('#shapeBtns .ctrl-btn').forEach((c,j)=>c.classList.toggle('active',j===i));buildInputs();draw()};
    btnDiv.appendChild(b);
});

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*800/1060)+'px'}
resize();window.addEventListener('resize',resize);

function buildInputs(){
    const s=shapes[selShape];const div=document.getElementById('inputFields');div.innerHTML='';
    s.params.forEach((p,i)=>{
        const row=document.createElement('div');row.className='param-row';
        row.innerHTML='<label>'+p+':</label><input type="number" class="dim-input" value="'+s.defaults[i]+'" min="0.5" max="15" step="0.5">';
        div.appendChild(row);
    });
    document.querySelectorAll('.dim-input').forEach(inp=>inp.addEventListener('input',draw));
}

function getValues(){return Array.from(document.querySelectorAll('.dim-input')).map(inp=>parseFloat(inp.value)||0)}

function draw(){
    const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
    const vals=getValues();
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);

    const sc=35;
    let volume=0,formula='',working='';

    if(selShape===0){
        // Cuboid - isometric
        const l=vals[0]*sc,w=vals[1]*sc,h=vals[2]*sc;
        const isoX=0.5,isoY=0.3; // isometric projection ratios
        const fx=cx-l/2+w*isoX/2,fy=cy+h/2;
        // Front face
        ctx.fillStyle='#637EA1';ctx.globalAlpha=0.15;
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+l,fy);ctx.lineTo(fx+l,fy-h);ctx.lineTo(fx,fy-h);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;ctx.strokeStyle='#637EA1';ctx.lineWidth=3;ctx.stroke();
        // Top face
        ctx.fillStyle='#637EA1';ctx.globalAlpha=0.08;
        ctx.beginPath();ctx.moveTo(fx,fy-h);ctx.lineTo(fx+l,fy-h);ctx.lineTo(fx+l+w*isoX,fy-h-w*isoY);ctx.lineTo(fx+w*isoX,fy-h-w*isoY);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;ctx.strokeStyle='#637EA1';ctx.lineWidth=3;ctx.stroke();
        // Right face
        ctx.fillStyle='#637EA1';ctx.globalAlpha=0.05;
        ctx.beginPath();ctx.moveTo(fx+l,fy);ctx.lineTo(fx+l+w*isoX,fy-w*isoY);ctx.lineTo(fx+l+w*isoX,fy-h-w*isoY);ctx.lineTo(fx+l,fy-h);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;ctx.strokeStyle='#637EA1';ctx.lineWidth=3;ctx.stroke();
        // Labels
        ctx.fillStyle='#1a1f2e';ctx.font='600 26px Oswald';ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText(vals[0]+' cm',fx+l/2,fy+10);
        ctx.save();ctx.translate(fx-14,fy-h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(vals[2]+' cm',0,0);ctx.restore();
        ctx.textAlign='center';ctx.fillText(vals[1]+' cm',fx+l+w*isoX/2+20,fy-w*isoY/2);

        volume=vals[0]*vals[1]*vals[2];
        formula='V = l \u00D7 w \u00D7 h';
        working=vals[0]+' \u00D7 '+vals[1]+' \u00D7 '+vals[2];
    } else if(selShape===1){
        // Cylinder
        const r=vals[0]*sc,h=vals[1]*sc;
        const ey=r*0.3;
        // Body
        ctx.fillStyle='#637EA1';ctx.globalAlpha=0.1;ctx.fillRect(cx-r,cy-h/2,r*2,h);ctx.globalAlpha=1;
        ctx.strokeStyle='#637EA1';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(cx-r,cy-h/2);ctx.lineTo(cx-r,cy+h/2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+r,cy-h/2);ctx.lineTo(cx+r,cy+h/2);ctx.stroke();
        // Top ellipse
        ctx.beginPath();ctx.ellipse(cx,cy-h/2,r,ey,0,0,Math.PI*2);ctx.fillStyle='#637EA1';ctx.globalAlpha=0.08;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#637EA1';ctx.lineWidth=3;ctx.stroke();
        // Bottom ellipse
        ctx.beginPath();ctx.ellipse(cx,cy+h/2,r,ey,0,0,Math.PI);ctx.stroke();
        ctx.setLineDash([6,4]);ctx.beginPath();ctx.ellipse(cx,cy+h/2,r,ey,0,Math.PI,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        // Labels
        ctx.fillStyle='#dc3545';ctx.strokeStyle='#dc3545';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx,cy-h/2);ctx.lineTo(cx+r,cy-h/2);ctx.stroke();
        ctx.font='600 26px Oswald';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('r = '+vals[0],cx+r/2,cy-h/2-8);
        ctx.fillStyle='#1a1f2e';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('h = '+vals[1],cx+r+12,cy);

        volume=Math.PI*vals[0]*vals[0]*vals[1];
        formula='V = \u03C0r\u00B2h';
        working='\u03C0 \u00D7 '+vals[0]+'\u00B2 \u00D7 '+vals[1]+' = \u03C0 \u00D7 '+(vals[0]*vals[0])+' \u00D7 '+vals[1];
    } else if(selShape===2){
        // Cone
        const r=vals[0]*sc,h=vals[1]*sc;
        const ey=r*0.3;
        ctx.fillStyle='#637EA1';ctx.globalAlpha=0.1;
        ctx.beginPath();ctx.moveTo(cx,cy-h/2);ctx.lineTo(cx-r,cy+h/2);ctx.lineTo(cx+r,cy+h/2);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
        ctx.strokeStyle='#637EA1';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(cx,cy-h/2);ctx.lineTo(cx-r,cy+h/2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx,cy-h/2);ctx.lineTo(cx+r,cy+h/2);ctx.stroke();
        ctx.beginPath();ctx.ellipse(cx,cy+h/2,r,ey,0,0,Math.PI);ctx.stroke();
        ctx.setLineDash([6,4]);ctx.beginPath();ctx.ellipse(cx,cy+h/2,r,ey,0,Math.PI,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        // Height
        ctx.setLineDash([6,4]);ctx.strokeStyle='#dc3545';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx,cy-h/2);ctx.lineTo(cx,cy+h/2);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#dc3545';ctx.font='600 26px Oswald';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('h = '+vals[1],cx+8,cy);
        ctx.fillStyle='#1a1f2e';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('r = '+vals[0],cx,cy+h/2+ey+8);

        volume=(1/3)*Math.PI*vals[0]*vals[0]*vals[1];
        formula='V = \u2153\u03C0r\u00B2h';
        working='\u2153 \u00D7 \u03C0 \u00D7 '+vals[0]+'\u00B2 \u00D7 '+vals[1]+' = \u2153 \u00D7 \u03C0 \u00D7 '+(vals[0]*vals[0])+' \u00D7 '+vals[1];
    } else if(selShape===3){
        // Sphere
        const r=vals[0]*sc;
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#637EA1';ctx.globalAlpha=0.1;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#637EA1';ctx.lineWidth=3;ctx.stroke();
        // Equator ellipse
        ctx.setLineDash([6,4]);ctx.beginPath();ctx.ellipse(cx,cy,r,r*0.3,0,0,Math.PI*2);ctx.strokeStyle='#637EA1';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
        // Radius
        ctx.strokeStyle='#dc3545';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r,cy);ctx.stroke();
        ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='#dc3545';ctx.fill();
        ctx.fillStyle='#dc3545';ctx.font='600 26px Oswald';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('r = '+vals[0],cx+r/2,cy-10);

        volume=(4/3)*Math.PI*vals[0]*vals[0]*vals[0];
        formula='V = \u2154\u03C0r\u00B3';
        working='\u2154 \u00D7 \u03C0 \u00D7 '+vals[0]+'\u00B3 = \u2154 \u00D7 \u03C0 \u00D7 '+(vals[0]*vals[0]*vals[0]);
    } else {
        // Triangular prism
        const b=vals[0]*sc,th=vals[1]*sc,l=vals[2]*sc;
        const isoX=0.45,isoY=0.25;
        const fx=cx-b/2-l*isoX/2,fy=cy+th/2;
        // Front triangle
        ctx.fillStyle='#637EA1';ctx.globalAlpha=0.15;
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+b,fy);ctx.lineTo(fx+b/2,fy-th);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;ctx.strokeStyle='#637EA1';ctx.lineWidth=3;ctx.stroke();
        // Back triangle (offset)
        const ox=l*isoX,oy=-l*isoY;
        ctx.beginPath();ctx.moveTo(fx+ox,fy+oy);ctx.lineTo(fx+b+ox,fy+oy);ctx.lineTo(fx+b/2+ox,fy-th+oy);ctx.closePath();ctx.strokeStyle='#637EA1';ctx.lineWidth=2;ctx.stroke();
        // Connecting edges
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+ox,fy+oy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(fx+b,fy);ctx.lineTo(fx+b+ox,fy+oy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(fx+b/2,fy-th);ctx.lineTo(fx+b/2+ox,fy-th+oy);ctx.stroke();
        // Top face fill
        ctx.fillStyle='#637EA1';ctx.globalAlpha=0.06;
        ctx.beginPath();ctx.moveTo(fx+b/2,fy-th);ctx.lineTo(fx+b,fy);ctx.lineTo(fx+b+ox,fy+oy);ctx.lineTo(fx+b/2+ox,fy-th+oy);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
        // Labels
        ctx.fillStyle='#1a1f2e';ctx.font='600 24px Oswald';ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText('base = '+vals[0],fx+b/2,fy+10);
        ctx.fillStyle='#dc3545';ctx.textAlign='left';ctx.fillText('h = '+vals[1],fx+b/2+8,fy-th/2);
        ctx.fillStyle='#1a1f2e';ctx.fillText('l = '+vals[2],fx+b+ox/2+10,fy+oy/2-10);

        const crossSection=0.5*vals[0]*vals[1];
        volume=crossSection*vals[2];
        formula='V = \u00BD \u00D7 base \u00D7 height \u00D7 length';
        working='\u00BD \u00D7 '+vals[0]+' \u00D7 '+vals[1]+' \u00D7 '+vals[2]+' = '+Math.round(crossSection*10)/10+' \u00D7 '+vals[2];
    }

    const r2=Math.round(volume*100)/100;
    document.getElementById('resultBox').textContent='Volume = '+r2+' cm\u00B3';
    document.getElementById('workingBox').innerHTML='<strong>Formula:</strong> '+formula+'<br><strong>Working:</strong> '+working+' = <strong>'+r2+' cm\u00B3</strong>';
}

buildInputs();draw();
</script>
</body>
</html>
