<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Transformations</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family: system-ui, -apple-system, sans-serif;background: #fcfcfe;padding:10px 12px;color:#1a2747}.container{max-width: 100%;margin:0 auto}h1{font-family: system-ui, -apple-system, sans-serif;font-size:1.0rem;color:#1835b4;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}.card{border-radius:5px;border:1px solid #d4d8e5;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;background:#fff}.card-title{font-family: system-ui, -apple-system, sans-serif;font-size:.85rem;color:#1835b4;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc}.controls{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.ctrl-btn{flex:1;min-width:70px;background:#e8ecf8;border:2px solid transparent;border-radius:5px;padding:6px;font-family: system-ui, -apple-system, sans-serif;font-size:.72rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}.ctrl-btn:hover{border-color:#1835b4}.ctrl-btn.active{background:#1835b4;color:#fff}.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;background:#e8ecf8;border-radius:5px;padding:8px}.slider-row label{font-size:.75rem;font-weight:600;min-width:110px}.slider-row input[type=range]{flex:1;accent-color:#1835b4}.slider-row .val{font-family: system-ui, -apple-system, sans-serif;font-size:.85rem;color:#1835b4;min-width:36px;text-align:center}.result-box{background:#e8ecf8;border-radius:5px;padding:8px 12px;text-align:center;font-family: system-ui, -apple-system, sans-serif;font-size:.9rem;color:#1835b4;margin-top:8px}.legend{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:.75rem}.legend span{display:flex;align-items:center;gap:4px}.leg-line{width:20px;height:3px;display:inline-block;border-radius:2px}.info{background:#fafbfc;border-radius:5px;padding:8px;font-size:.75rem;color:#4a5568;text-align:center;margin-top:8px}.info strong{color:#1835b4}</style>
</head>
<body>
<div class="container">
    <h1>Graph Transformations</h1>
    <div class="card">
        <div class="card-title">Base Function</div>
        <div class="controls" id="funcBtns"></div>
    </div>
    <div class="card">
        <div class="card-title">Transformations</div>
        <div class="slider-row"><label>a (vertical stretch)</label><input type="range" id="aSlider" min="-3" max="3" step="0.25" value="1"><span class="val" id="aVal">1</span></div>
        <div class="slider-row"><label>h (horizontal shift)</label><input type="range" id="hSlider" min="-5" max="5" step="0.5" value="0"><span class="val" id="hVal">0</span></div>
        <div class="slider-row"><label>k (vertical shift)</label><input type="range" id="kSlider" min="-5" max="5" step="0.5" value="0"><span class="val" id="kVal">0</span></div>
        <div class="slider-row"><label>n (horiz. stretch 1/n)</label><input type="range" id="nSlider" min="-3" max="3" step="0.25" value="1"><span class="val" id="nVal">1</span></div>
    </div>
    <div class="card" style="padding:8px"><canvas id="canvas" width="1060" height="1060"></canvas></div>
    <div class="result-box" id="eqDisplay">y = f(x)</div>
    <div class="legend">
        <span><span class="leg-line" style="background:#aaa;border-top:2px dashed #aaa"></span> Original f(x)</span>
        <span><span class="leg-line" style="background:#1835b4"></span> Transformed</span>
    </div>
    <div class="info">Transformations: <strong>a</strong> stretches vertically, <strong>h</strong> shifts horizontally, <strong>k</strong> shifts vertically, <strong>n</strong> stretches horizontally (by 1/n).</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const funcs=[
    {name:'x\u00B2',fn:x=>x*x,label:'x\u00B2'},
    {name:'x\u00B3',fn:x=>x*x*x,label:'x\u00B3'},
    {name:'sin(x)',fn:x=>Math.sin(x),label:'sin(x)'},
    {name:'1/x',fn:x=>x===0?NaN:1/x,label:'1/x'}
];
let selFunc=0;
const btnDiv=document.getElementById('funcBtns');
funcs.forEach((f,i)=>{
    const b=document.createElement('button');b.className='ctrl-btn'+(i===0?' active':'');b.textContent=f.name;
    b.onclick=()=>{selFunc=i;document.querySelectorAll('#funcBtns .ctrl-btn').forEach((c,j)=>c.classList.toggle('active',j===i));draw()};
    btnDiv.appendChild(b);
});

const aS=document.getElementById('aSlider'),hS=document.getElementById('hSlider'),kS=document.getElementById('kSlider'),nS=document.getElementById('nSlider');
const aV=document.getElementById('aVal'),hV=document.getElementById('hVal'),kV=document.getElementById('kVal'),nV=document.getElementById('nVal');

function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=w+'px'}
resize();window.addEventListener('resize',resize);

function plotCurve(fn,color,dashed,lineW){
    const W=canvas.width,H=canvas.height,cxC=W/2,cyC=H/2,scale=W/12;
    ctx.strokeStyle=color;ctx.lineWidth=lineW||3;
    if(dashed)ctx.setLineDash([8,6]);else ctx.setLineDash([]);
    ctx.beginPath();let first=true;
    for(let px=-6.5;px<=6.5;px+=0.03){
        const py=fn(px);
        if(isNaN(py)||!isFinite(py)||Math.abs(py)>8){first=true;continue}
        const sx=cxC+px*scale,sy=cyC-py*scale;
        if(first){ctx.moveTo(sx,sy);first=false}else ctx.lineTo(sx,sy);
    }
    ctx.stroke();ctx.setLineDash([]);
}

function draw(){
    const W=canvas.width,H=canvas.height,cxC=W/2,cyC=H/2,scale=W/12;
    const a=parseFloat(aS.value),h=parseFloat(hS.value),k=parseFloat(kS.value),n=parseFloat(nS.value);
    aV.textContent=a;hV.textContent=h;kV.textContent=k;nV.textContent=n;

    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);
    // Grid
    ctx.strokeStyle='#d4d8e5';ctx.lineWidth=1;
    for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(cxC+i*scale,0);ctx.lineTo(cxC+i*scale,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,cyC-i*scale);ctx.lineTo(W,cyC-i*scale);ctx.stroke()}
    ctx.strokeStyle='#1a2747';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,cyC);ctx.lineTo(W,cyC);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cxC,0);ctx.lineTo(cxC,H);ctx.stroke();
    ctx.fillStyle='#4a5568';ctx.font='500 22px Oswald';
    for(let i=-5;i<=5;i++){if(i===0)continue;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(i,cxC+i*scale,cyC+6);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(i,cxC-8,cyC-i*scale)}

    const baseFn=funcs[selFunc].fn;
    // Original (dashed)
    plotCurve(baseFn,'#aaa',true,2);
    // Transformed: y = a * f(n(x - h)) + k
    const tFn=x=>{
        const inner=n!==0?n*(x-h):0;
        return a*baseFn(inner)+k;
    };
    plotCurve(tFn,'#1835b4',false,3);

    // Equation
    const fl=funcs[selFunc].label;
    let innerStr='x';
    if(n!==1&&n!==0) innerStr=n+'x';
    if(h>0) innerStr+=' - '+h;else if(h<0) innerStr+=' + '+Math.abs(h);
    let eq='y = ';
    if(a!==1) eq+=(a===-1?'-':a)+' \u00B7 ';
    eq+=fl.replace('x','('+innerStr+')');
    if(k>0) eq+=' + '+k;else if(k<0) eq+=' - '+Math.abs(k);
    document.getElementById('eqDisplay').textContent=eq;
}

[aS,hS,kS,nS].forEach(s=>s.addEventListener('input',draw));
draw();
</script>
</body>
</html>
