<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powers & Roots Explorer</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#fcfcfe;padding:10px 12px;color:#1a2747}
.container{max-width:100%;margin:0 auto}
h1{font-size:1.0rem;color:#1835b4;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.card{border-radius:5px;border:1px solid #d4d8e5;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;background:#fff}
.card-title{font-size:.85rem;color:#1835b4;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.input-row label{font-size:.78rem;font-weight:600;color:#1835b4}
.input-row input[type=number]{width:70px;padding:4px 8px;border:1px solid #d4d8e5;border-radius:4px;font-size:.85rem;font-family:system-ui,-apple-system,sans-serif;text-align:center}
.btn{padding:5px 12px;border:none;border-radius:4px;background:#1835b4;color:#fff;font-size:.75rem;cursor:pointer;font-family:system-ui,-apple-system,sans-serif}
.btn:hover{background:#122a8a}
.btn.outline{background:#e8ecf8;color:#1835b4;border:1px solid #d4d8e5}
.btn.outline:hover{background:#d4d8e5}
.btn.active{background:#1835b4;color:#fff}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.result-box{background:#e8ecf8;border-radius:5px;padding:10px 14px;text-align:center;margin-top:8px}
.result-box .label{font-size:.65rem;color:#4a5568;margin-bottom:2px}
.result-box .value{font-size:1.0rem;color:#1835b4;font-weight:600}
.steps{background:#fafbfc;border-radius:5px;padding:8px 12px;font-size:.82rem;color:#1a2747;margin-top:8px;text-align:center;line-height:1.6}
.steps .op{color:#1835b4;font-weight:600}
.toggle-row{display:flex;gap:8px;align-items:center;margin-top:8px;justify-content:center}
canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc;width:100%}
.info{background:#fafbfc;border-radius:5px;padding:8px;font-size:.75rem;color:#4a5568;text-align:center;margin-top:8px}
.info strong{color:#1835b4}
    </style>
</head>
<body>
<div class="container">
    <h1>Powers & Roots Explorer</h1>
    <div class="card">
        <div class="card-title">Input</div>
        <div class="input-row">
            <label>Base:</label>
            <input type="number" id="base" value="2" step="any">
            <label>Exponent:</label>
            <input type="number" id="exponent" value="4" min="0" max="20" step="1">
            <button class="btn" onclick="calculate()">Calculate</button>
        </div>
        <div class="quick-btns">
            <button class="btn outline" onclick="setQuick(null,2)">Square</button>
            <button class="btn outline" onclick="setQuick(null,3)">Cube</button>
            <button class="btn outline" onclick="setQuick(null,0.5)">Square Root</button>
            <button class="btn outline" onclick="setQuick(null,1/3)">Cube Root</button>
        </div>
        <div class="toggle-row">
            <label style="font-size:.78rem;font-weight:600;color:#1835b4">Mode:</label>
            <button class="btn" id="btnPower" onclick="setMode('power')">Power</button>
            <button class="btn outline" id="btnRoot" onclick="setMode('root')">Inverse (Root)</button>
        </div>
    </div>
    <div class="card">
        <div class="card-title">Result</div>
        <div class="result-box"><div class="label" id="calcLabel">Calculation</div><div class="value" id="calcValue">--</div></div>
        <div class="steps" id="stepsDisplay"></div>
    </div>
    <div class="card" style="padding:8px">
        <canvas id="canvas" width="800" height="400"></canvas>
    </div>
    <div class="info">Enter a base and exponent, or use quick buttons. Toggle to <strong>Root</strong> mode to see the inverse operation.</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let mode='power';

function setMode(m){
    mode=m;
    document.getElementById('btnPower').className=m==='power'?'btn':'btn outline';
    document.getElementById('btnRoot').className=m==='root'?'btn':'btn outline';
    calculate();
}
function setQuick(b,e){
    if(b!==null)document.getElementById('base').value=b;
    document.getElementById('exponent').value=e;
    calculate();
}
function calculate(){
    const base=parseFloat(document.getElementById('base').value)||0;
    const exp=parseFloat(document.getElementById('exponent').value)||0;
    const label=document.getElementById('calcLabel');
    const value=document.getElementById('calcValue');
    const steps=document.getElementById('stepsDisplay');

    if(mode==='power'){
        const result=Math.pow(base,exp);
        if(exp===Math.floor(exp)&&exp>=1&&exp<=12){
            let parts=[];for(let i=0;i<exp;i++)parts.push(base);
            label.textContent=base+'^'+exp;
            value.textContent=base+'\u207F = '+parseFloat(result.toFixed(6));
            steps.innerHTML='<span class="op">'+parts.join(' \u00d7 ')+'</span> = <span class="op">'+parseFloat(result.toFixed(6))+'</span>';
        } else if(exp===0.5){
            label.textContent='Square root of '+base;
            value.textContent='\u221a'+base+' = '+parseFloat(result.toFixed(6));
            steps.innerHTML='<span class="op">\u221a'+base+' = '+parseFloat(result.toFixed(6))+'</span> because <span class="op">'+parseFloat(result.toFixed(6))+'\u00b2 \u2248 '+base+'</span>';
        } else if(Math.abs(exp-1/3)<0.001){
            label.textContent='Cube root of '+base;
            value.textContent='\u221b'+base+' = '+parseFloat(result.toFixed(6));
            steps.innerHTML='<span class="op">\u221b'+base+' = '+parseFloat(result.toFixed(6))+'</span> because <span class="op">'+parseFloat(result.toFixed(6))+'\u00b3 \u2248 '+base+'</span>';
        } else {
            label.textContent=base+'^'+exp;
            value.textContent=parseFloat(result.toFixed(6));
            steps.innerHTML='<span class="op">'+base+'<sup>'+exp+'</sup> = '+parseFloat(result.toFixed(6))+'</span>';
        }
        drawBar(base,exp,result);
    } else {
        // Root mode: given base^exp = result, show exp-th root of result = base
        const powered=Math.pow(base,exp);
        const rootVal=Math.pow(powered,1/exp);
        label.textContent=ordinal(exp)+' root of '+parseFloat(powered.toFixed(4));
        value.textContent=parseFloat(rootVal.toFixed(6));
        steps.innerHTML='<span class="op">'+base+'<sup>'+exp+'</sup> = '+parseFloat(powered.toFixed(4))+'</span>, so the inverse: <span class="op">'+parseFloat(powered.toFixed(4))+'<sup>1/'+exp+'</sup> = '+parseFloat(rootVal.toFixed(6))+'</span>';
        drawBar(base,exp,powered);
    }
}
function ordinal(n){if(n===2)return'square';if(n===3)return'cube';return n+'th';}

function drawBar(base,exp,result){
    const W=canvas.width,H=canvas.height;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);
    const intExp=Math.floor(exp);
    if(intExp<1||intExp>12||intExp!==exp){
        ctx.fillStyle='#1835b4';ctx.font='600 18px system-ui';ctx.textAlign='center';
        ctx.fillText(base+'^'+exp+' = '+parseFloat(result.toFixed(4)),W/2,H/2);
        return;
    }
    const barW=Math.min(60,(W-40)/(intExp*1.2));
    const maxVal=Math.abs(result);
    const barH=maxVal>0?Math.min(H-80,150):20;
    const startX=(W-intExp*(barW+8))/2;
    ctx.fillStyle='#1835b4';ctx.font='600 13px system-ui';ctx.textAlign='center';
    let running=1;
    for(let i=0;i<intExp;i++){
        running*=base;
        const x=startX+i*(barW+8);
        const h=barH*(Math.abs(running)/maxVal);
        const y=H-60-h;
        ctx.fillStyle='rgba(24,53,180,'+(0.3+0.7*i/(intExp-1||1))+')';
        ctx.fillRect(x,y,barW,h);
        ctx.fillStyle='#1a2747';ctx.font='600 11px system-ui';
        ctx.fillText('\u00d7'+base,x+barW/2,H-42);
        ctx.fillText(parseFloat(running.toFixed(2)),x+barW/2,y-8);
    }
    ctx.fillStyle='#1835b4';ctx.font='600 16px system-ui';
    ctx.fillText('Repeated multiplication: '+base+' multiplied '+intExp+' times = '+parseFloat(result.toFixed(4)),W/2,30);
}
calculate();
function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*0.5)+'px';}
window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
