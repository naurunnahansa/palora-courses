<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Under a Curve (Trapezium Rule)</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#fcfcfe;padding:10px 12px;color:#1a2747}
.container{max-width:100%;margin:0 auto}
h1{font-size:1.0rem;color:#1835b4;text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.card{border-radius:5px;border:1px solid #d4d8e5;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;background:#fff}
.card-title{font-size:.85rem;color:#1835b4;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.slider-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.slider-row label{font-size:.78rem;font-weight:600;min-width:90px;color:#1835b4}
.slider-row input[type=range]{flex:1;accent-color:#1835b4}
.slider-row .val{font-size:.85rem;min-width:36px;text-align:right;color:#1835b4}
.toggle-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;justify-content:center}
.toggle-btn{padding:5px 10px;border:1px solid #d4d8e5;border-radius:4px;background:#e8ecf8;color:#1835b4;font-size:.72rem;cursor:pointer;font-family:system-ui;font-weight:600}
.toggle-btn.active{background:#1835b4;color:#fff;border-color:#1835b4}
canvas{display:block;margin:0 auto;border-radius:4px;background:#fafbfc;width:100%}
.readouts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.readout{background:#e8ecf8;border-radius:5px;padding:6px 8px;text-align:center}
.readout .label{font-size:.65rem;color:#4a5568}
.readout .value{font-size:.82rem;color:#1835b4;font-weight:600}
.readout .value.good{color:#2a6e2a}
.readout .value.warn{color:#c27878}
.info{background:#fafbfc;border-radius:5px;padding:8px;font-size:.75rem;color:#4a5568;text-align:center;margin-top:8px}
.info strong{color:#1835b4}
    </style>
</head>
<body>
<div class="container">
    <h1>Area Under a Curve (Trapezium Rule)</h1>
    <div class="card">
        <div class="card-title">Select Curve</div>
        <div class="toggle-row">
            <button class="toggle-btn active" onclick="setCurve(0)">y = x\u00b2 + 1</button>
            <button class="toggle-btn" onclick="setCurve(1)">y = x\u00b3 + 2</button>
            <button class="toggle-btn" onclick="setCurve(2)">y = sin(x) + 2</button>
            <button class="toggle-btn" onclick="setCurve(3)">y = \u221ax + 1</button>
        </div>
        <div class="slider-row">
            <label>Trapeziums (n)</label>
            <input type="range" id="slN" min="2" max="20" step="1" value="4">
            <span class="val" id="valN">4</span>
        </div>
        <div class="slider-row">
            <label>From x =</label>
            <input type="range" id="slA" min="0" max="3" step="0.5" value="0">
            <span class="val" id="valA">0</span>
        </div>
        <div class="slider-row">
            <label>To x =</label>
            <input type="range" id="slB" min="1" max="6" step="0.5" value="4">
            <span class="val" id="valB">4</span>
        </div>
    </div>
    <div class="card" style="padding:8px">
        <canvas id="canvas" width="1060" height="800"></canvas>
    </div>
    <div class="card">
        <div class="card-title">Results</div>
        <div class="readouts">
            <div class="readout"><div class="label">Trapezium Estimate</div><div class="value" id="estimate"></div></div>
            <div class="readout"><div class="label">Exact Integral</div><div class="value" id="exact"></div></div>
            <div class="readout"><div class="label">Error (%)</div><div class="value" id="error"></div></div>
        </div>
    </div>
    <div class="info">Increase the number of <strong>trapeziums</strong> to see how the approximation improves. More strips = better accuracy.</div>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const slN=document.getElementById('slN'),slAx=document.getElementById('slA'),slBx=document.getElementById('slB');
const W=canvas.width,H=canvas.height;
let curveIdx=0;

const curves=[
    {name:'y = x\u00b2 + 1',f:x=>x*x+1,integral:(a,b)=>(b*b*b/3+b)-(a*a*a/3+a)},
    {name:'y = x\u00b3 + 2',f:x=>x*x*x+2,integral:(a,b)=>(b*b*b*b/4+2*b)-(a*a*a*a/4+2*a)},
    {name:'y = sin(x) + 2',f:x=>Math.sin(x)+2,integral:(a,b)=>(-Math.cos(b)+2*b)-(-Math.cos(a)+2*a)},
    {name:'y = \u221ax + 1',f:x=>Math.sqrt(Math.max(0,x))+1,integral:(a,b)=>(2/3*Math.pow(Math.max(0,b),1.5)+b)-(2/3*Math.pow(Math.max(0,a),1.5)+a)}
];

function setCurve(i){
    curveIdx=i;
    document.querySelectorAll('.toggle-btn').forEach((b,j)=>b.className='toggle-btn'+(j===i?' active':''));
    draw();
}
[slN,slAx,slBx].forEach(s=>s.addEventListener('input',draw));
function fmt(v){return parseFloat(v.toFixed(4));}

function draw(){
    const n=parseInt(slN.value);
    let xa=parseFloat(slAx.value),xb=parseFloat(slBx.value);
    if(xa>=xb)xb=xa+0.5;
    document.getElementById('valN').textContent=n;
    document.getElementById('valA').textContent=xa;
    document.getElementById('valB').textContent=xb;

    const curve=curves[curveIdx];
    const h=(xb-xa)/n;

    // Trapezium rule
    let sum=curve.f(xa)+curve.f(xb);
    for(let i=1;i<n;i++)sum+=2*curve.f(xa+i*h);
    const estimate=h/2*sum;

    const exact=curve.integral(xa,xb);
    const errorPct=exact!==0?Math.abs((estimate-exact)/exact*100):0;

    document.getElementById('estimate').textContent=fmt(estimate);
    document.getElementById('exact').textContent=fmt(exact);
    const errEl=document.getElementById('error');
    errEl.textContent=fmt(errorPct)+'%';
    errEl.className='value'+(errorPct<1?' good':errorPct<5?'':' warn');

    // Drawing
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);

    // Graph area
    const margin={l:60,r:30,t:30,b:50};
    const gw=W-margin.l-margin.r,gh=H-margin.t-margin.b;

    // Find y range
    let yMin=0,yMax=0;
    for(let x=xa;x<=xb;x+=(xb-xa)/200){
        const y=curve.f(x);
        if(y>yMax)yMax=y;
        if(y<yMin)yMin=y;
    }
    yMax*=1.2;if(yMax<1)yMax=1;
    const xRange=xb-xa;const xPad=xRange*0.15;
    const xMin=xa-xPad,xMax=xb+xPad;

    function toP(x,y){
        return[margin.l+(x-xMin)/(xMax-xMin)*gw, margin.t+gh-(y-yMin)/(yMax-yMin)*gh];
    }

    // Grid lines
    ctx.strokeStyle='#f0eeef';ctx.lineWidth=1;
    for(let i=0;i<=10;i++){
        const y=yMin+(yMax-yMin)*i/10;
        const[,py]=toP(xa,y);
        ctx.beginPath();ctx.moveTo(margin.l,py);ctx.lineTo(W-margin.r,py);ctx.stroke();
    }
    for(let x=Math.ceil(xMin);x<=Math.floor(xMax);x++){
        const[px]=toP(x,0);
        ctx.beginPath();ctx.moveTo(px,margin.t);ctx.lineTo(px,H-margin.b);ctx.stroke();
    }

    // Axes
    ctx.strokeStyle='#ccc';ctx.lineWidth=2;
    const[,zeroY]=toP(0,0);
    ctx.beginPath();ctx.moveTo(margin.l,zeroY);ctx.lineTo(W-margin.r,zeroY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(margin.l,margin.t);ctx.lineTo(margin.l,H-margin.b);ctx.stroke();

    // Axis labels
    ctx.fillStyle='#999';ctx.font='12px system-ui';ctx.textAlign='center';
    for(let x=Math.ceil(xMin);x<=Math.floor(xMax);x++){
        const[px]=toP(x,0);
        ctx.fillText(x,px,H-margin.b+16);
    }
    ctx.textAlign='right';
    for(let i=0;i<=5;i++){
        const y=yMin+(yMax-yMin)*i/5;
        const[,py]=toP(xa,y);
        ctx.fillText(fmt(y),margin.l-8,py+4);
    }

    // Draw trapeziums
    for(let i=0;i<n;i++){
        const x0=xa+i*h,x1=xa+(i+1)*h;
        const y0=curve.f(x0),y1=curve.f(x1);
        const[px0,py0]=toP(x0,y0);
        const[px1,py1]=toP(x1,y1);
        const[,pyBase]=toP(0,0);

        ctx.fillStyle='rgba(24,53,180,0.12)';
        ctx.beginPath();
        ctx.moveTo(px0,pyBase);ctx.lineTo(px0,py0);ctx.lineTo(px1,py1);ctx.lineTo(px1,pyBase);
        ctx.closePath();ctx.fill();

        ctx.strokeStyle='rgba(24,53,180,0.4)';ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(px0,pyBase);ctx.lineTo(px0,py0);ctx.lineTo(px1,py1);ctx.lineTo(px1,pyBase);
        ctx.closePath();ctx.stroke();
    }

    // Curve
    ctx.strokeStyle='#1835b4';ctx.lineWidth=3;ctx.beginPath();let first=true;
    for(let px=margin.l;px<=W-margin.r;px+=2){
        const x=xMin+(px-margin.l)/gw*(xMax-xMin);
        const y=curve.f(x);
        const[,py]=toP(x,y);
        if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
    }
    ctx.stroke();

    // Title
    ctx.fillStyle='#1835b4';ctx.font='bold 16px system-ui';ctx.textAlign='center';
    ctx.fillText(curve.name+'  |  n = '+n+' trapeziums',W/2,22);
}
draw();
function resize(){const w=Math.min(530,canvas.parentElement.clientWidth-16);canvas.style.width=w+'px';canvas.style.height=(w*0.75)+'px';}
window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
