<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Pollutant Explorer</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family: system-ui, -apple-system, sans-serif;background:#f0f2f5;color:#1a2747;min-height:100vh;display:flex;justify-content:center;padding:20px;}
h1,h2,h3,h4{font-family: system-ui, -apple-system, sans-serif;text-transform:uppercase;letter-spacing:0.5px;}
.container{max-width: 100%;width:100%;margin:0 auto;}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,0.08);border:1px solid #d4d8e5;padding:24px;margin-bottom:16px;}
.card-title{font-size:1.3rem;color:#1835b4;margin-bottom:4px;}
.card-subtitle{font-size:0.85rem;color:#888;margin-bottom:16px;}
canvas{width:100%;background:#fafbfc;border-radius:10px;border:1px solid #d4d8e5;display:block;margin:10px 0;}
.chip{display:inline-block;padding:6px 14px;border-radius:20px;border:1.5px solid #d4d8e5;font-size:0.82rem;cursor:pointer;transition:all 0.2s;margin:3px;background:#fff;font-family: system-ui, -apple-system, sans-serif;}
.chip:hover,.chip.active{background:#1835b4;color:#fff;border-color:#1835b4;}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.detail-card{background:#e8ecf8;border-radius:12px;padding:16px;margin-top:10px;display:none;}
.detail-card.show{display:block;}
.detail-card h3{color:#1835b4;font-size:1rem;margin-bottom:8px;}
.detail-row{padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06);font-size:0.85rem;}
.detail-row:last-child{border-bottom:none;}
.detail-row .dlabel{color:#888;font-weight:500;font-size:0.78rem;margin-bottom:2px;}
.detail-row .dvalue{color:#1a2747;font-weight:500;line-height:1.4;}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2 class="card-title">Air Pollutant Explorer</h2>
    <p class="card-subtitle">Select a pollutant to explore its sources, effects and solutions</p>
    <canvas id="canvas" width="510" height="260"></canvas>
    <div class="tabs" id="tabs"></div>
    <div class="detail-card" id="detail"></div>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 510; canvas.height = 260;

const pollutants = [
  {
    id:'co', name:'Carbon Monoxide (CO)', formula:'CO', color:'#cc5555',
    source:'Incomplete combustion of fossil fuels in car engines, boilers and cigarettes. Produced when there is insufficient oxygen for complete combustion.',
    envEffect:'Does not directly damage the environment significantly, but contributes to ground-level ozone formation which harms plants.',
    healthEffect:'Toxic gas. Binds to haemoglobin in blood (forming carboxyhaemoglobin) more strongly than oxygen, reducing oxygen delivery to organs. Can cause headaches, dizziness, unconsciousness and death.',
    reduce:'Use catalytic converters in vehicles (converts CO to CO\u2082). Ensure complete combustion with sufficient air supply. Regular maintenance of boilers and engines.'
  },
  {
    id:'so2', name:'Sulfur Dioxide (SO\u2082)', formula:'SO\u2082', color:'#ddaa33',
    source:'Burning fossil fuels (coal and oil) that contain sulfur impurities. Power stations and industrial processes are major sources.',
    envEffect:'Dissolves in rainwater to form sulfuric acid (acid rain, pH < 5.6). Acid rain damages limestone buildings, corrodes metals, kills fish in lakes (lowers pH), and damages forests by leaching nutrients from soil.',
    healthEffect:'Irritates the respiratory system. Aggravates asthma and bronchitis. Can cause difficulty breathing, especially in vulnerable groups.',
    reduce:'Remove sulfur from fuels before burning (desulfurisation). Use flue gas desulfurisation in power stations (limestone scrubbers neutralise SO\u2082). Switch to low-sulfur fuels or renewables.'
  },
  {
    id:'nox', name:'Nitrogen Oxides (NO\u2093)', formula:'NO\u2093', color:'#8855cc',
    source:'Formed when nitrogen and oxygen from the air react at high temperatures inside car engines and power stations. Lightning also produces small amounts naturally.',
    envEffect:'Contributes to acid rain (forms nitric acid). Causes photochemical smog. Contributes to ground-level ozone which damages crops and vegetation.',
    healthEffect:'Irritates lungs and airways. Worsens respiratory conditions such as asthma and bronchitis. Long-term exposure can reduce lung function.',
    reduce:'Catalytic converters in vehicles (convert NO\u2093 to harmless N\u2082 and O\u2082). Use lower combustion temperatures. Switch to electric vehicles.'
  },
  {
    id:'pm', name:'Particulates (PM)', formula:'PM\u2082.\u2085/PM\u2081\u2080', color:'#777',
    source:'Combustion of fossil fuels (especially diesel), industrial processes, construction dust, and natural sources like volcanoes and wildfires. Tiny solid particles and liquid droplets.',
    envEffect:'Reduces visibility (smog/haze). Deposits on buildings causing soiling. Can affect climate by absorbing or reflecting sunlight.',
    healthEffect:'Fine particles (PM\u2082.\u2085) penetrate deep into lungs and can enter the bloodstream. Causes respiratory disease, cardiovascular problems, lung cancer. Particularly dangerous for children and elderly.',
    reduce:'Fit particulate filters to diesel exhausts. Use cleaner fuels. Regulate industrial emissions. Improve public transport to reduce vehicle numbers.'
  }
];

let selected = 0;
let t = 0;
let smokeParticles = [];

for (let i = 0; i < 60; i++) {
  smokeParticles.push({
    x: 120 + Math.random() * 20,
    y: 100 + Math.random() * 50,
    r: 2 + Math.random() * 4,
    vx: -0.2 + Math.random() * 0.8,
    vy: -0.5 - Math.random() * 0.8,
    alpha: 0.3 + Math.random() * 0.4,
    type: Math.floor(Math.random() * 4)
  });
}

// Build tabs
const tabsEl = document.getElementById('tabs');
pollutants.forEach((p, i) => {
  const chip = document.createElement('span');
  chip.className = 'chip' + (i === 0 ? ' active' : '');
  chip.textContent = p.formula;
  chip.onclick = () => { selected = i; updateTabs(); };
  tabsEl.appendChild(chip);
});

function updateTabs() {
  document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('active', i === selected));
  const p = pollutants[selected];
  const det = document.getElementById('detail');
  det.className = 'detail-card show';
  det.innerHTML =
    '<h3>' + p.name + '</h3>' +
    '<div class="detail-row"><div class="dlabel">Source</div><div class="dvalue">' + p.source + '</div></div>' +
    '<div class="detail-row"><div class="dlabel">Environmental Effect</div><div class="dvalue">' + p.envEffect + '</div></div>' +
    '<div class="detail-row"><div class="dlabel">Health Effect</div><div class="dvalue">' + p.healthEffect + '</div></div>' +
    '<div class="detail-row"><div class="dlabel">How to Reduce</div><div class="dvalue">' + p.reduce + '</div></div>';
}

function draw() {
  t++;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#a8c0d8');
  skyGrad.addColorStop(1, '#dde8f0');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

  // Ground
  ctx.fillStyle = '#8aaa6a'; ctx.fillRect(0, H - 30, W, 30);

  // Factory
  ctx.fillStyle = '#778'; ctx.fillRect(80, 100, 80, H - 130);
  // Chimney
  ctx.fillStyle = '#666'; ctx.fillRect(110, 50, 20, 55);
  ctx.fillRect(100, 100, 40, 10);

  // Car
  ctx.fillStyle = '#556';
  ctx.beginPath(); ctx.roundRect(300, H - 58, 80, 28, 4); ctx.fill();
  ctx.fillStyle = '#445';
  ctx.beginPath(); ctx.roundRect(315, H - 75, 50, 20, [6,6,0,0]); ctx.fill();
  // Wheels
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(318, H - 28, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(362, H - 28, 8, 0, Math.PI*2); ctx.fill();
  // Exhaust
  ctx.fillStyle = '#888'; ctx.fillRect(295, H - 42, 8, 5);

  // Smoke particles
  const pol = pollutants[selected];
  smokeParticles.forEach(sp => {
    const isFromFactory = sp.x < 250;
    ctx.globalAlpha = sp.alpha * (sp.type === selected ? 1 : 0.2);
    ctx.fillStyle = pol.color;
    if (sp.type === selected) {
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r * 0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Labels on bigger particles
    if (sp.type === selected && sp.r > 4) {
      ctx.fillStyle = '#fff'; ctx.font = '700 6px Outfit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pol.formula, sp.x, sp.y);
    }

    sp.x += sp.vx + Math.sin(t * 0.02 + sp.y) * 0.2;
    sp.y += sp.vy;
    sp.alpha -= 0.002;

    if (sp.y < -10 || sp.alpha <= 0) {
      // Reset
      const fromFactory = Math.random() < 0.6;
      sp.x = fromFactory ? 118 + Math.random() * 14 : 296 + Math.random() * 8;
      sp.y = fromFactory ? 52 : H - 42;
      sp.alpha = 0.3 + Math.random() * 0.4;
      sp.vx = -0.2 + Math.random() * 0.8;
      sp.vy = -0.4 - Math.random() * 0.7;
      sp.r = 2 + Math.random() * 4;
      sp.type = Math.floor(Math.random() * 4);
    }
  });

  // Legend
  ctx.font = '600 11px Outfit'; ctx.textAlign = 'left';
  ctx.fillStyle = pol.color;
  ctx.beginPath(); ctx.arc(W - 140, 18, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#444';
  ctx.fillText(pol.formula + ' particles', W - 128, 22);

  // Source labels
  ctx.fillStyle = '#555'; ctx.font = '500 10px Outfit'; ctx.textAlign = 'center';
  ctx.fillText('Factory', 120, H - 6);
  ctx.fillText('Vehicle', 340, H - 6);

  requestAnimationFrame(draw);
}

updateTabs();
draw();
</script>
</body>
</html>
